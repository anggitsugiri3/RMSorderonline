<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e4161c">
<title>DnA Mart — Pesan Online</title>
<!-- PWA: manifest + icon, biar bisa "Add to Home Screen" / diinstall kayak app -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Apps Script: POST ke script.google.com lalu di-redirect ke script.googleusercontent.com - sambungkan dua-duanya lebih awal -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- Ikon Material Symbols (subset 54 ikon). Tambah ikon baru = tambahkan namanya di &icon_names (urut abjad). -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,add_shopping_cart,arrow_back,arrow_forward,bakery_dining,bolt,call,category,chat,check,check_circle,chevron_right,child_care,cleaning_services,close,cloud_off,confirmation_number,cookie,delete,eco,event_available,favorite,grid_view,grocery,home,info,inventory_2,local_cafe,local_drink,local_fire_department,local_mall,local_offer,local_shipping,location_on,loyalty,medical_services,monetization_on,outdoor_grill,person,price_check,print,ramen_dining,receipt_long,recommend,redeem,remove,remove_shopping_cart,schedule,search,sell,share,shopping_bag,shopping_basket,shopping_cart,skillet,spa,stars,storefront,sync,timer,tune,verified&display=block" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — warna & tipografi khas "warung/kraft paper"
   ============================================================ */
:root{
  --paper:36 55% 96%;
  --paper-mid:36 55% 93%;
  --paper-deep:34 42% 86%;
  --paper-line:32 38% 80%;
  --ink:20 30% 16%;
  --ink-soft:20 15% 42%;
  --card:0 0% 100%;
  --receipt:40 60% 98%;
  --red:355 78% 46%;
  --green:142 58% 36%;
  --gold:43 97% 58%;
  --gold-ink:28 70% 22%;
  --r-sm:10px;
  --r-md:16px;
  --r-lg:24px;
  --shadow-sm:0 1px 2px rgba(35,20,8,.08);
  --shadow-md:0 10px 30px -10px rgba(35,20,8,.35);
  --dur:180ms;
  --f-sans:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{line-height:1.5;-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-sans);
  color:hsl(var(--ink));
  background:
    radial-gradient(circle at 1px 1px, hsl(var(--paper-line)/.45) 1px, transparent 0) 0 0/16px 16px,
    hsl(var(--paper-deep));
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
}
.app{width:100%;max-width:460px;min-height:100vh;background:hsl(var(--card));position:relative;display:flex;flex-direction:column}
@media (min-width:560px){
  body{padding:40px 16px}
  .app{min-height:calc(100vh - 80px);border-radius:var(--r-lg);overflow:hidden;overflow:clip;box-shadow:var(--shadow-md)}
}
button,input,textarea,select{font:inherit;letter-spacing:inherit}
button{cursor:pointer}
input,textarea{font-family:inherit}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em}
.font-chalk{font-family:var(--f-sans)}
.font-mono{font-family:var(--f-mono)}
:focus-visible{outline:2px solid hsl(var(--red));outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* ============================================================
   HEADER, BOTTOM-NAV & BERANDA — gaya Alfagift (mengikuti tampilan
   HomeScreen/NavbarHeader/BottomNavigation di proyek React referensi).
   Palet khusus (--z-*) dipisah dari token kraft-paper di atas supaya
   tab lain (Belanja/Pesanan/Akun) tidak ikut berubah warna isinya.
   ============================================================ */
:root{
  --z-red:#b0001a; --z-red2:#d91a2a; --z-blue:#0c5fae;
  --z-ink:#111c2d; --z-muted:#5d3f3d; --z-bg:#f0f3ff; --z-line:#dee8ff;
  --z-pink:#ffdad7; --z-gold:#ffdf99;
}
/* Ikon Material Symbols (subset lewat &icon_names di <head>). Kotak 1em + overflow
   hidden: kalau font gagal dimuat, yang kelihatan cuma huruf pertama, bukan
   nama ikon panjang yang merusak layout. */
.msym{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;flex:none;width:1em;height:1em;overflow:hidden;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;user-select:none}
.msym.fill{font-variation-settings:'FILL' 1}

/* ---------- Header (sticky) ---------- */
.app-header{position:sticky;top:0;z-index:30;display:flex;flex-direction:column;gap:6px;padding:8px 16px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(222,232,255,.6);box-shadow:0 1px 8px rgba(0,0,0,.04)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px}
.hdr-loc{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.hdr-loc .msym{font-size:18px;color:var(--z-red)}
.hdr-loc .lbl{color:var(--z-muted);flex:none}
.hdr-loc b{color:var(--z-ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-pill{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--z-line);color:var(--z-blue);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:999px}
.hdr-main{display:flex;align-items:center;gap:8px;height:40px}
.store-mark{width:30px;height:30px;flex:none;border-radius:999px;background:hsl(var(--gold));color:hsl(var(--gold-ink));display:flex;align-items:center;justify-content:center;font-family:var(--f-sans);font-weight:700;font-size:20px;overflow:hidden}
.store-mark img{width:100%;height:100%;object-fit:cover}
.search-row{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--z-bg);border:1px solid rgba(222,232,255,.8);transition:border-color var(--dur)}
.search-row:focus-within{border-color:rgba(176,0,26,.5)}
.search-row .msym{font-size:18px;color:var(--z-muted)}
.search-row input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:12px;color:var(--z-ink)}
.search-row input::placeholder{color:rgba(93,63,61,.7)}
.search-clear{border:none;background:none;color:var(--z-muted);display:flex;flex:none;padding:2px}
.search-clear .msym{font-size:16px}
.hdr-actions{display:flex;align-items:center;gap:2px;flex:none}
.icon-btn{position:relative;width:36px;height:36px;border-radius:999px;border:none;background:none;color:var(--z-ink);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:color var(--dur)}
.icon-btn:hover{color:var(--z-red)}
.icon-btn:active{transform:scale(.94)}
.icon-btn .msym{font-size:22px}
.badge-count{position:absolute;top:2px;right:0;background:var(--z-red);color:#fff;font-size:9px;font-weight:700;line-height:1;border-radius:999px;min-width:16px;height:16px;padding:0 4px;align-items:center;justify-content:center}

/* ---------- Generic layout bits ---------- */
.section{padding:0 16px}
.h-scroll{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid hsl(var(--paper-line));background:hsl(var(--paper-mid));color:hsl(var(--ink));white-space:nowrap;transition:background var(--dur)}
.chip[data-active="true"]{background:hsl(var(--ink));border-color:hsl(var(--ink));color:#fff}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px 18px}

/* price-tag product card: rounded bottom, punch-hole circle on top */
.price-tag{position:relative;background:hsl(var(--card));border:1px solid hsl(var(--paper-line));border-radius:6px 6px 14px 14px;padding:22px 12px 12px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.price-tag:before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:999px;background:hsl(var(--paper-deep));border:2px solid hsl(var(--paper-line))}
.price-tag .thumb{font-size:38px;text-align:center;line-height:1;margin-bottom:8px}
.price-tag .thumb-wrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:8px;margin-bottom:8px;overflow:hidden;background:hsl(var(--paper-mid))}
.price-tag .thumb-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(16px) saturate(1.15);transform:scale(1.2);opacity:.55}
.price-tag img.thumb-img{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.price-tag .name{font-size:13px;font-weight:600;line-height:1.35;min-height:2.5em}
.price-tag .unit{font-size:11px;color:hsl(var(--ink-soft));margin-top:2px}
.price-tag .price{font-family:var(--f-sans);font-weight:700;color:hsl(var(--red));margin-top:8px;font-size:15px}
.price-tag .price-old{font-family:var(--f-sans);font-size:11px;color:hsl(var(--ink-soft));text-decoration:line-through}
.discount-flag{position:absolute;top:8px;right:8px;background:hsl(var(--red));color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px}
.stock-flag{margin-top:6px;align-self:flex-start;font-size:10px;font-weight:600;color:hsl(var(--red));border:1px solid hsl(var(--red));border-radius:999px;padding:2px 8px}
.stock-out{margin-top:10px;text-align:center;font-size:11px;font-weight:600;color:hsl(var(--ink-soft));background:hsl(var(--paper-mid));border-radius:8px;padding:9px}
.btn-add{margin-top:10px;border:none;border-radius:8px;padding:8px 0;font-size:12.5px;font-weight:600;background:hsl(var(--green));color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;transition:filter var(--dur)}
.btn-add:hover{filter:brightness(1.06)}
.btn-add:active{transform:scale(.97)}
.qty-stepper{margin-top:10px;display:flex;align-items:center;justify-content:space-between;background:hsl(var(--paper-mid));border:1px solid hsl(var(--paper-line));border-radius:8px}
.qty-stepper button{border:none;background:none;padding:7px 10px;display:flex;color:hsl(var(--ink))}
.qty-stepper button:disabled{opacity:.3}
.qty-stepper span{font-family:var(--f-sans);font-weight:700;font-size:13px}

/* ---------- Empty states ---------- */
.empty-state{padding:56px 28px;text-align:center;color:hsl(var(--ink-soft));display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-state .icon{width:34px;height:34px;opacity:.4}
.empty-state p{font-size:13.5px;margin:0;line-height:1.5}
.btn-primary{border:none;border-radius:999px;padding:10px 22px;font-size:13.5px;font-weight:600;background:hsl(var(--red));color:#fff;transition:filter var(--dur)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:scale(.96)}

.section-head{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 4px}
.section-head h2{font-family:var(--f-sans);font-size:24px;margin:0}
.section-head .link{font-size:12px;font-weight:600;color:hsl(var(--green));background:none;border:none}

/* ---------- Beranda (gaya Alfagift) ---------- */
.hm{display:flex;flex-direction:column;width:100%;color:var(--z-ink)}
.hm-sec{margin-bottom:20px}
.hm-sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;margin-bottom:8px}
.hm-sec-title{display:flex;align-items:center;gap:8px;min-width:0}
.hm-sec-ic{width:24px;height:24px;flex:none;border-radius:999px;background:var(--z-red);color:#fff;display:flex;align-items:center;justify-content:center}
.hm-sec-ic .msym{font-size:15px}
.hm-sec h3{margin:0;font-size:14px;font-weight:800;color:var(--z-ink);display:flex;align-items:center;gap:6px}
.hm-sec h3 .msym{font-size:18px;color:var(--z-red)}
.hm-sub{margin:0;font-size:10px;color:var(--z-muted)}
.hm-more{display:flex;align-items:center;gap:2px;border:none;background:none;padding:0;font-size:12px;font-weight:700;color:var(--z-blue);flex:none}
.hm-more .msym{font-size:14px}
.hm-more.red{color:var(--z-red)}
.hm-more.red .msym{font-size:15px}

/* 1. Antar / Ambil */
.hm-fulfil{padding:8px 16px}
.hm-seg{display:flex;align-items:center;padding:4px;border-radius:999px;background:var(--z-bg);border:1px solid var(--z-line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hm-seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border:none;border-radius:999px;background:none;font-size:12px;font-weight:700;color:var(--z-muted);transition:background var(--dur),color var(--dur)}
.hm-seg button .msym{font-size:17px}
.hm-seg button[data-active="true"]{background:#fff;color:var(--z-blue);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 2. Kartu member + poin + promo */
.hm-wallet{margin:0 16px 16px;padding:12px;background:#fff;border:1px solid var(--z-line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hm-wallet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-12px -12px 10px;padding:10px 12px 8px;background:rgba(240,243,255,.7);border-bottom:1px solid rgba(222,232,255,.4);border-radius:12px 12px 0 0}
.hm-member{display:flex;align-items:center;gap:6px;min-width:0}
.hm-member-ic{width:24px;height:24px;flex:none;border-radius:999px;background:#d8e3fb;color:var(--z-blue);display:flex;align-items:center;justify-content:center}
.hm-member-ic .msym{font-size:15px}
.hm-member-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-verified{font-size:14px;color:#2563eb}
.hm-link{display:flex;align-items:center;gap:2px;flex:none;border:none;background:none;padding:0;font-size:11px;font-weight:700;color:var(--z-blue)}
.hm-link .msym{font-size:13px}
.hm-mosaic{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hm-tile{display:flex;flex-direction:column;justify-content:space-between;width:100%;padding:10px;text-align:left;border-radius:8px;border:1px solid;font:inherit;color:inherit;transition:background var(--dur)}
.hm-tile.gold{background:rgba(255,223,153,.35);border-color:rgba(255,223,153,.6)}
.hm-tile.gold:hover{background:rgba(255,223,153,.5)}
.hm-tile.pink{background:rgba(255,218,215,.35);border-color:rgba(255,218,215,.7)}
.hm-tile.pink:hover{background:rgba(255,218,215,.5)}
.hm-tile-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.hm-tile-lbl{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase}
.hm-tile-lbl .msym{font-size:18px}
.hm-tile.gold .hm-tile-lbl{color:#5a4300}
.hm-tile.gold .hm-tile-lbl .msym{color:#8b6900}
.hm-tile.pink .hm-tile-lbl{color:#930014}
.hm-tile.pink .hm-tile-lbl .msym{color:var(--z-red)}
.hm-tile-btn{background:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hm-tile.gold .hm-tile-btn{color:#6d5200}
.hm-tile.pink .hm-tile-btn{color:#930014}
.hm-tile-val{margin-top:8px;display:flex;align-items:baseline}
.hm-tile-num{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--z-ink)}
.hm-tile-unit{font-size:11px;color:var(--z-muted);margin-left:4px}

/* 3. Shortcut cepat */
.hm-quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 16px;margin-bottom:16px}
.hm-q{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;border:none;background:none;padding:0;text-align:center;color:inherit}
.hm-q-ic{position:relative;width:48px;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform var(--dur)}
.hm-q:hover .hm-q-ic{transform:scale(1.05)}
.hm-q-ic .msym{font-size:24px}
.hm-q-badge{position:absolute;top:-4px;right:-4px;font-size:8px;font-weight:900;line-height:1.4;padding:0 4px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.hm-q-badge.pulse{animation:hmPulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes hmPulse{50%{opacity:.55}}
.hm-q-lbl{max-width:100%;font-size:11px;font-weight:600;line-height:1.3;color:var(--z-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 4. Banner hero */
.hm-hero{position:relative;margin:0 16px 20px;overflow:hidden;border-radius:12px;background:linear-gradient(to right,#b0001a,#d91a2a,#0c5fae);color:#fff;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
.hm-hero-body{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:16px}
.hm-hero-txt{flex:1;min-width:0;padding-right:8px}
.hm-hero-tag{display:inline-flex;align-items:center;gap:4px;margin-bottom:6px;padding:2px 8px;border-radius:999px;background:var(--z-gold);color:#251a00;font-size:9px;font-weight:900;text-transform:uppercase}
.hm-hero-tag .msym{font-size:11px}
.hm-hero h2{margin:0;font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.hm-hero h2 em{display:block;font-style:normal;color:var(--z-gold)}
.hm-hero p{margin:4px 0 0;display:flex;align-items:center;gap:4px;font-size:10px;font-weight:500;line-height:1.4;color:#ffefed}
.hm-hero p .msym{font-size:13px}
.hm-hero-cta{margin-top:10px;padding:4px 12px;border:none;border-radius:999px;background:#fff;color:var(--z-red);font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:background var(--dur)}
.hm-hero-cta:hover{background:var(--z-bg)}
.hm-hero-img{position:relative;width:96px;height:96px;flex:none;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.hm-hero-img .msym{font-size:44px;color:rgba(255,255,255,.9)}
.hm-hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hm-dots{display:flex;align-items:center;justify-content:center;gap:6px;padding-bottom:8px;position:relative;z-index:1}
.hm-dots i{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.4)}
.hm-dots i.on{width:20px;background:#fff}

/* 4.5 Jajanan & Minuman */
.hm-jj{margin:0 16px 20px;padding:14px 14px 16px;background:linear-gradient(180deg,#fff4f3,#fffaf9 60%);border:1px solid rgba(255,218,215,.8);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hm-jj-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hm-jj-title{display:flex;align-items:center;gap:10px;min-width:0}
.hm-jj-ic{width:36px;height:36px;flex:none;border-radius:999px;background:#ffdad7;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
.hm-jj-title h3{margin:0;font-size:14px;font-weight:800;color:var(--z-ink);line-height:1.3}
.hm-jj-title p{margin:1px 0 0;font-size:10.5px;color:var(--z-muted);line-height:1.3}
.hm-jj-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hm-jj-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;border:none;background:none;padding:0;color:inherit;text-align:center}
.hm-jj-item-ic{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform var(--dur)}
.hm-jj-item:hover .hm-jj-item-ic{transform:scale(1.05)}
.hm-jj-item-ic .msym{font-size:21px}
.hm-jj-item span{max-width:100%;font-size:10px;font-weight:600;line-height:1.25;color:var(--z-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 5. Kejar Diskon (scroll horizontal) + countdown */
.hm-count{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;font-weight:700;color:#fff}
.hm-count b{padding:2px 4px;border-radius:4px;background:var(--z-red);font-weight:700;line-height:1}
.hm-count i{font-style:normal;font-weight:900;color:var(--z-red)}
.hm-hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.hm-hscroll::-webkit-scrollbar{display:none}
.hm-hscroll .hm-card{flex:none;width:144px;scroll-snap-align:start}

/* Kartu produk (dipakai Kejar Diskon & Rekomendasi) */
.hm-card{display:flex;flex-direction:column;justify-content:space-between;padding:8px;background:#fff;border:1px solid var(--z-line);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.hm-thumb{position:relative;width:100%;aspect-ratio:1/1;margin-bottom:6px;border-radius:6px;overflow:hidden;background:var(--z-bg);display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1}
.hm-thumb-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(16px) saturate(1.15);transform:scale(1.2);opacity:.55}
.hm-thumb img{position:relative;width:100%;height:100%;object-fit:contain;padding:4px}
.hm-disc{position:absolute;top:4px;left:4px;z-index:1;padding:2px 6px;border-radius:4px;background:var(--z-red);color:#fff;font-size:9px;font-weight:800}
.hm-pkg{display:block;font-size:10px;font-weight:500;color:var(--z-muted)}
.hm-name{margin:2px 0 0;min-height:30px;font-size:12px;font-weight:600;line-height:1.25;color:var(--z-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hm-price{margin:4px 0 0;font-size:12px;font-weight:800;color:var(--z-red)}
.hm-old{margin:0;font-size:10px;color:#916f6c;text-decoration:line-through}
.hm-add{margin-top:8px;width:100%;padding:4px 0;border:none;border-radius:4px;background:var(--z-bg);color:var(--z-red);font-size:12px;font-weight:700;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background var(--dur),color var(--dur)}
.hm-add:hover{background:var(--z-red);color:#fff}
.hm-step{margin-top:8px;display:flex;align-items:center;justify-content:space-between;border-radius:4px;background:var(--z-bg)}
.hm-step button{display:flex;padding:4px 10px;border:none;background:none;color:var(--z-red)}
.hm-step button:disabled{opacity:.3}
.hm-step .msym{font-size:18px}
.hm-step b{font-size:12px;font-weight:800}
.hm-out{margin-top:8px;padding:5px 0;border-radius:4px;background:var(--z-bg);color:var(--z-muted);font-size:11px;font-weight:600;text-align:center}

/* 6. Kategori Pilihan */
.hm-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.hm-cat{display:flex;flex-direction:column;align-items:center;min-width:0;padding:8px;text-align:center;border-radius:8px;background:#fff;border:1px solid var(--z-line);box-shadow:0 1px 2px rgba(0,0,0,.05);color:inherit;transition:background var(--dur)}
.hm-cat:hover{background:var(--z-bg)}
.hm-cat-ic{width:40px;height:40px;margin-bottom:6px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:transform var(--dur)}
.hm-cat:hover .hm-cat-ic{transform:scale(1.05)}
.hm-cat-ic .msym{font-size:20px}
.hm-cat-n{max-width:100%;font-size:10px;font-weight:600;line-height:1.25;color:var(--z-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* 7. Rekomendasi Spesial (grid 2 kolom) */
.hm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.hm-grid .hm-card{padding:10px;border-radius:12px}
.hm-grid .hm-thumb{margin-bottom:8px;border-radius:8px}
.hm-grid .hm-disc{top:6px;left:6px;font-size:10px}
.hm-grid .hm-name{min-height:32px;font-weight:700}
.hm-grid .hm-pkg{margin-top:2px}
.hm-grid .hm-price{margin-top:6px}
.hm-chip{display:inline-flex;align-items:center;gap:4px;margin-bottom:4px;padding:2px 6px;border-radius:4px;background:var(--z-line);color:var(--z-blue);font-size:9px;font-weight:700}
.hm-chip .msym{font-size:11px}
.hm-chip.low{background:var(--z-pink);color:var(--z-red)}
.hm-chip.out{background:var(--z-bg);color:var(--z-muted)}
.hm-grid .hm-add{margin-top:10px;padding:6px 0;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:4px}
.hm-grid .hm-add .msym{font-size:16px}
.hm-grid .hm-step,.hm-grid .hm-out{margin-top:10px;border-radius:8px}
.hm-grid .hm-out{padding:7px 0}

/* Kartu status katalog (memuat / gagal / kosong) */
.hm-empty{margin:0 16px 20px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;background:#fff;border:1px solid var(--z-line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.hm-empty-ic{width:48px;height:48px;margin-bottom:8px;border-radius:999px;background:#d1fae5;color:#059669;display:flex;align-items:center;justify-content:center}
.hm-empty-ic .msym{font-size:26px}
.hm-empty.err .hm-empty-ic{background:var(--z-pink);color:var(--z-red)}
.hm-empty h4{margin:0;font-size:14px;font-weight:800;color:var(--z-ink)}
.hm-empty p{margin:4px 0 0;max-width:20rem;font-size:12px;line-height:1.6;color:var(--z-muted)}
.hm-empty button{margin-top:12px;width:100%;padding:8px 0;border:none;border-radius:12px;background:var(--z-blue);color:#fff;font-size:12px;font-weight:700;transition:filter var(--dur)}
.hm-empty button:hover{filter:brightness(.92)}

/* ---------- Pesanan / list cards ---------- */
.order-card{background:hsl(var(--card));border:1px solid hsl(var(--paper-line));border-radius:14px;padding:14px 16px;margin-bottom:10px;text-align:left;width:100%}
.order-card-top{display:flex;align-items:center;justify-content:space-between}
.order-status{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid hsl(var(--gold));color:hsl(var(--gold-ink));background:hsl(var(--gold)/.18)}
.order-meta{font-size:11.5px;color:hsl(var(--ink-soft));margin-top:5px}
.order-total{font-family:var(--f-sans);font-weight:700;color:hsl(var(--red));margin-top:5px}
.order-items{font-size:11px;color:hsl(var(--ink-soft));margin-top:6px;line-height:1.5}
.order-status[data-belum-bayar="true"]{border-color:hsl(var(--red));color:hsl(var(--red));background:hsl(var(--red)/.1)}
/* BARU - tombol "Batalkan Pesanan": kartu jadi div pembungkus, bagian yang bisa
   diklik buat buka struk pindah ke button terpisah di dalamnya (button di dalam
   button itu HTML tidak valid) - lihat tabPesanan(). */
.order-card-open{background:none;border:none;padding:0;margin:0;width:100%;text-align:left;display:block}
.order-cancel-btn{width:100%;margin-top:10px;border-radius:10px;padding:9px;font-size:12.5px;font-weight:600;background:none}

/* ---------- Akun / bantuan ---------- */
.info-card{background:hsl(var(--card));border:1px solid hsl(var(--paper-line));border-radius:14px;padding:16px;margin:14px 16px 0}
.info-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;padding:8px 0}
.info-row .icon{width:16px;height:16px;flex:none;margin-top:2px;color:hsl(var(--green))}
.info-row strong{display:block;font-size:12px;color:hsl(var(--ink-soft));font-weight:600;margin-bottom:1px}
.wa-btn{margin-top:10px;width:100%;border:none;border-radius:12px;padding:12px;background:hsl(var(--green));color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.faq-list{margin:14px 16px 24px;border:1px solid hsl(var(--paper-line));border-radius:14px;overflow:hidden;background:hsl(var(--card))}
.faq-item{border-bottom:1px solid hsl(var(--paper-line))}
.faq-item:last-child{border-bottom:none}
.faq-q{width:100%;background:none;border:none;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;text-align:left;color:hsl(var(--ink))}
.faq-q .icon{transition:transform var(--dur);color:hsl(var(--ink-soft))}
.faq-item[data-open="true"] .faq-q .icon{transform:rotate(180deg)}
.faq-a{padding:0 16px 14px;font-size:12.5px;color:hsl(var(--ink-soft));line-height:1.6}

/* ---------- Legal (Syarat & Ketentuan / Kebijakan Refund) ---------- */
.akun-menu{background:hsl(var(--card));border:1px solid hsl(var(--paper-line));border-radius:14px;margin:14px 16px 0;overflow:hidden}
.akun-menu-btn{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border:none;background:none;font-size:13px;font-weight:500;color:hsl(var(--ink));text-align:left;border-bottom:1px solid hsl(var(--paper-line))}
.akun-menu-btn:last-child{border-bottom:none}
.akun-menu-btn .chev{margin-left:auto;color:hsl(var(--ink-soft))}
.legal-text{font-size:12.5px;line-height:1.7;color:hsl(var(--ink-soft))}
.legal-text h3{font-size:13px;color:hsl(var(--ink));margin:16px 0 6px}
.legal-text h3:first-child{margin-top:0}
.legal-text ul,.legal-text ol{margin:4px 0;padding-left:18px}
.legal-text li{margin:3px 0}
.legal-text .legal-updated{font-size:11px;color:hsl(var(--ink-soft));margin-bottom:10px}

/* #tab-content butuh jarak bawah karena bottom-nav (dan mini-cart) sekarang
   position:fixed - tidak lagi makan ruang di alur dokumen seperti sticky dulu. */
#tab-content{padding-bottom:84px}
#tab-content.has-mini-cart{padding-bottom:196px}

/* ---------- Bottom nav ---------- */
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:460px;z-index:30;height:64px;padding:0 4px;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--z-line);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.nav-btn{position:relative;flex:1;height:56px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--z-muted);transition:color var(--dur)}
.nav-btn:hover{color:var(--z-ink)}
.nav-btn .msym{font-size:24px}
.nav-btn .lbl{margin-top:2px;font-size:10px;line-height:1.2}
.nav-btn[data-active="true"]{color:var(--z-red);font-weight:700}
.nav-btn[data-active="true"]::after{content:"";position:absolute;bottom:4px;width:6px;height:6px;border-radius:999px;background:var(--z-red)}

/* ---------- Mini cart (bar melayang) ---------- */
.mini-cart{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);width:calc(100% - 32px);max-width:428px;z-index:29;margin:0;padding:12px;border:none;border-radius:12px;background:linear-gradient(to right,var(--z-red),var(--z-red2));color:#fff;font:inherit;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 20px 25px -5px rgba(0,0,0,.12),0 8px 10px -6px rgba(0,0,0,.12)}
.mini-cart .left{display:flex;align-items:center;gap:10px;min-width:0}
.mini-cart .bag{position:relative;width:40px;height:40px;flex:none;border-radius:999px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.mini-cart .bag .msym{font-size:20px}
.mini-cart .cnt{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:var(--z-gold);color:#251a00;font-size:10px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}
.mini-cart .lbl{display:block;font-size:10px;line-height:1.2;color:#ffefed}
.mini-cart .total{display:block;font-size:14px;font-weight:800;line-height:1.2}
.mini-cart .go{flex:none;display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:999px;background:#fff;color:var(--z-red);font-size:12px;font-weight:700;box-shadow:0 4px 6px -1px rgba(0,0,0,.12)}
.mini-cart .go .msym{font-size:16px}

/* ---------- Overlays: cart sheet / dialogs ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none}
.overlay[data-open="true"]{display:block}
.overlay-backdrop{position:absolute;inset:0;background:rgba(20,12,6,.45);opacity:0;transition:opacity var(--dur)}
.overlay[data-open="true"] .overlay-backdrop{opacity:1}

.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:460px;max-height:82vh;background:hsl(var(--receipt));border-radius:22px 22px 0 0;display:flex;flex-direction:column;transition:transform var(--dur) ease-out}
.overlay[data-open="true"] .sheet{transform:translate(-50%,0)}
.sheet-handle{width:36px;height:4px;border-radius:999px;background:hsl(var(--paper-line));margin:10px auto 2px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px}
.sheet-head h2{font-family:var(--f-sans);font-size:26px;margin:0}
.sheet-body{overflow-y:auto;padding:4px 18px 18px;flex:1}
.close-x{border:none;background:hsl(var(--paper-mid));width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:hsl(var(--ink))}

.cart-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed hsl(var(--paper-line))}
.cart-line:first-child{padding-top:4px}
.cart-line-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.cart-line-sub{font-size:11.5px;color:hsl(var(--ink-soft));margin-top:2px;font-family:var(--f-sans)}
.cart-line-total{font-family:var(--f-sans);font-weight:700;color:hsl(var(--red));white-space:nowrap;font-size:13px}
.cart-summary{border-top:1px dashed hsl(var(--paper-line));margin-top:6px;padding-top:14px;font-family:var(--f-sans)}
.cart-summary-row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;margin-bottom:12px}
.cart-summary-row .val{color:hsl(var(--red))}

.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:calc(100% - 32px);max-width:420px;max-height:86vh;overflow-y:auto;background:hsl(var(--card));border-radius:var(--r-lg);padding:20px;opacity:0;transition:transform var(--dur) ease-out,opacity var(--dur) ease-out}
.overlay[data-open="true"] .dialog{transform:translate(-50%,-50%) scale(1);opacity:1}
.dialog h2{font-family:var(--f-sans);font-size:26px;margin:0 0 14px}

.method-toggle{display:flex;gap:8px;margin-bottom:14px}
.method-btn{flex:1;border:1px solid hsl(var(--paper-line));border-radius:10px;padding:11px 8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;background:hsl(var(--card));color:hsl(var(--ink))}
.method-btn[data-active="true"]{border-color:hsl(var(--green));background:hsl(var(--green)/.1);font-weight:600;color:hsl(var(--green))}

.field-label-plain{font-size:12px;font-weight:600;color:hsl(var(--ink-soft));margin-bottom:5px}
.qris-box{border:1px solid hsl(var(--paper-line));border-radius:12px;padding:14px;margin-bottom:14px;text-align:center;background:hsl(var(--card))}
.qris-box img{width:180px;height:180px;object-fit:contain;border-radius:8px;margin:0 auto 10px;display:block;background:#fff}
.qris-total{font-family:var(--f-sans);font-weight:700;font-size:16px;margin-bottom:6px}
.qris-note{font-size:11.5px;color:hsl(var(--ink-soft));line-height:1.6}
.qris-missing{font-size:12px;color:hsl(var(--red));line-height:1.6}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:hsl(var(--ink-soft));margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid hsl(var(--paper-line));border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;background:hsl(var(--paper)/.4);resize:none;color:hsl(var(--ink))}
.field input:focus,.field textarea:focus{border-color:hsl(var(--green))}

.checkout-summary{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed hsl(var(--paper-line));padding-top:12px;margin-top:4px;font-family:var(--f-sans)}
.checkout-summary .val{font-weight:700;font-size:17px;color:hsl(var(--red))}
.submit-btn{width:100%;margin-top:14px;border:none;border-radius:12px;padding:13px;background:hsl(var(--gold));color:hsl(var(--gold-ink));font-weight:700;font-size:14px}
.submit-btn:disabled{opacity:.45;cursor:not-allowed}
.submit-hint{font-size:11px;color:hsl(var(--ink-soft));text-align:center;margin-top:8px;line-height:1.5}

/* ---------- Receipt (struk) ---------- */
.receipt-dialog{background:transparent;box-shadow:none;padding:0;max-width:300px}
.receipt-edge{width:100%;height:10px;background:linear-gradient(-45deg,hsl(var(--receipt)) 6px,transparent 0),linear-gradient(45deg,hsl(var(--receipt)) 6px,transparent 0);background-repeat:repeat-x;background-size:12px 12px}
.receipt-edge.bottom{transform:rotate(180deg)}
.receipt-body{background:hsl(var(--receipt));padding:26px 22px;text-align:center;font-family:var(--f-mono);position:relative}
.receipt-body .close-x{position:absolute;top:10px;right:10px}
.receipt-eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:hsl(var(--ink-soft))}
.receipt-msg{font-size:13px;margin:8px 0}
.receipt-num{font-size:24px;font-weight:700;color:hsl(var(--green))}
.receipt-div{border-top:1px dashed hsl(var(--paper-line));margin:14px 0}
.receipt-detail{text-align:left;font-size:11.5px;line-height:1.9}
.receipt-items{text-align:left;font-size:11px;line-height:1.7;max-height:140px;overflow-y:auto}
.receipt-note{font-size:10.5px;color:hsl(var(--ink-soft));line-height:1.6}

/* ---------- Akun member / login-daftar ---------- */
.account-card{background:hsl(var(--card));border:1px solid hsl(var(--paper-line));border-radius:14px;padding:16px;margin:14px 16px 0}
.account-card .who{display:flex;align-items:center;gap:12px}
.account-avatar{width:44px;height:44px;border-radius:999px;background:hsl(var(--green)/.15);color:hsl(var(--green));display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.account-avatar .icon{width:22px;height:22px}
.account-avatar img{width:100%;height:100%;object-fit:cover;border-radius:999px}
.avatar-upload{width:48px;height:48px}
.avatar-hero{background:rgba(255,255,255,.18);color:#fff}
.avatar-edit-btn{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:999px;background:hsl(var(--red));color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid hsl(var(--card));cursor:pointer}
.avatar-edit-btn .icon{width:10px;height:10px}
.avatar-edit-btn input{display:none}
.poin-hi-row{display:flex;align-items:center;gap:10px}
.account-name{font-weight:700;font-size:14.5px}
.account-sub{font-size:11.5px;color:hsl(var(--ink-soft));margin-top:1px}
.account-guest-note{font-size:12.5px;color:hsl(var(--ink-soft));line-height:1.55;margin-top:2px}
.retention-notice{font-size:12.5px;color:hsl(var(--ink));line-height:1.5;border:1px solid hsl(var(--green));background:hsl(var(--green)/.07);border-radius:12px;padding:11px 14px;margin-bottom:12px}
.qris-timer{font-family:var(--f-sans);font-size:13px;font-weight:700;color:hsl(var(--green));background:hsl(var(--green)/.1);border-radius:999px;padding:5px 14px;display:inline-block;margin-bottom:10px}
.qris-timer[data-expired="true"]{color:hsl(var(--red));background:hsl(var(--red)/.1)}
.btn-outline{border:1px solid hsl(var(--paper-line));border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;background:hsl(var(--card));color:hsl(var(--ink))}
.btn-outline.danger{border-color:hsl(var(--red));color:hsl(var(--red))}
.account-actions{display:flex;gap:8px;margin-top:12px}
.account-actions .btn-primary,.account-actions .btn-outline{flex:1;padding:10px 8px;text-align:center}

.auth-tabs{display:flex;gap:8px;margin-bottom:14px}
.auth-tab{flex:1;border:1px solid hsl(var(--paper-line));border-radius:10px;padding:9px 8px;font-size:12.5px;font-weight:600;background:hsl(var(--card));color:hsl(var(--ink-soft))}
.auth-tab[data-active="true"]{border-color:hsl(var(--red));background:hsl(var(--red)/.08);color:hsl(var(--red))}
.auth-hint{font-size:11.5px;color:hsl(var(--ink-soft));line-height:1.6;margin:-2px 0 12px}
.auth-error{color:hsl(var(--red));font-size:12.5px;margin:-2px 0 10px;text-align:center}
.link-btn{border:none;background:none;color:hsl(var(--green));font-weight:600;font-size:12.5px;padding:0}
.guest-link-row{text-align:center;margin-top:14px;font-size:12.5px;color:hsl(var(--ink-soft))}

/* ---------- Admin (Nama Toko & No. WA) ---------- */
.admin-entry-row{text-align:center;padding:20px 16px 30px}
.admin-entry-row .link-btn{color:hsl(var(--ink-soft));font-weight:500}
.admin-note{font-size:11.5px;color:hsl(var(--ink-soft));line-height:1.6;margin:-2px 0 12px}
.admin-logo-row{display:flex;align-items:center;gap:12px}
.admin-logo-preview{width:56px;height:56px;border-radius:999px;background:hsl(var(--gold));color:hsl(var(--gold-ink));display:flex;align-items:center;justify-content:center;font-family:var(--f-sans);font-weight:700;font-size:26px;overflow:hidden;flex:none;border:1px solid hsl(var(--paper-line))}
.admin-logo-preview img{width:100%;height:100%;object-fit:cover}
.admin-logo-actions{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.admin-logo-upload{display:inline-block;cursor:pointer}
.admin-produk-list{display:flex;flex-direction:column;gap:10px;margin-bottom:4px}
.admin-produk-row{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid hsl(var(--paper-line));border-radius:12px}
.admin-produk-thumb{position:relative;width:52px;height:52px;flex:none;border-radius:8px;overflow:hidden;background:hsl(var(--paper-mid));display:flex;align-items:center;justify-content:center;font-size:22px}
.admin-produk-thumb img{width:100%;height:100%;object-fit:contain}
.admin-produk-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.admin-produk-nama{font-size:12.5px;font-weight:600;color:hsl(var(--ink));line-height:1.3}
.admin-produk-upload{display:inline-block;cursor:pointer;padding:6px 12px;font-size:11.5px}
.toast{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;bottom:18px;z-index:80;background:hsl(var(--ink));color:#fff;text-align:center;font-size:12.5px;font-weight:600;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-md);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity var(--dur),transform var(--dur)}
.toast[data-open="true"]{opacity:1;transform:translateY(0)}

.riwayat-toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0}
.riwayat-toolbar h2{margin:0}

/* ---------- Kartu Poin Member (tab Akun) ---------- */
.poin-card{margin:14px 16px 0;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);background:hsl(var(--card))}
.poin-card-plain{border:1px solid hsl(var(--paper-line));padding:16px}
.poin-hero{background:linear-gradient(135deg, hsl(var(--red)), hsl(0 65% 34%));color:#fff;padding:18px 18px 22px}
.poin-hi{font-size:15px}
.poin-hi strong{font-family:var(--f-sans);font-size:22px;font-weight:700;margin-left:2px}
.poin-tier-badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px 4px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.poin-tier-badge .icon{width:14px;height:14px;color:hsl(var(--gold))}
.poin-stats{display:flex;align-items:center;background:hsl(var(--card));margin:-14px 12px 0;border-radius:16px;box-shadow:var(--shadow-md);padding:14px 8px;position:relative}
.poin-stat{flex:1;text-align:center;padding:0 6px}
.poin-stat-num{display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:19px;color:hsl(var(--ink))}
.poin-stat-num .icon{width:18px;height:18px;color:hsl(var(--gold-ink))}
.poin-stat-label{font-size:11px;color:hsl(var(--ink-soft));margin-top:2px}
.poin-stat-divider{width:1px;align-self:stretch;background:hsl(var(--paper-line))}
.poin-barcode-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:14px 16px 16px;border:1px dashed hsl(var(--paper-line));border-radius:12px;padding:11px;font-size:12.5px;font-weight:700;background:hsl(var(--paper-mid));color:hsl(var(--ink))}
.poin-barcode-btn .icon{width:16px;height:16px}
.poin-card-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:22px;color:hsl(var(--ink-soft));font-size:12.5px}
.poin-card-loading .icon{width:18px;height:18px}
.poin-error{font-size:12.5px;color:hsl(var(--red));line-height:1.6}

/* ===== Tipografi = proyek zip (font sans sistem Tailwind, teks dominan 12px/700, judul 14px/800) ===== */
.section-head h2,.account-name,.cart-summary-row,.checkout-summary .val{font-size:14px;font-weight:800}
.sheet-head h2,.dialog h2{font-size:16px;font-weight:800}
.store-mark,.admin-logo-preview{font-weight:800}
.store-mark{font-size:14px}
.poin-hi strong{font-size:16px;font-weight:800}
.chip,.btn-add,.btn-primary,.wa-btn,.order-cancel-btn,.btn-outline,.auth-tab,.method-btn,.submit-btn,.qty-stepper span,.cart-line-name,.field label,.field-label-plain,.toast{font-size:12px;font-weight:700}
.price-tag .name{font-size:12px;font-weight:700;line-height:1.25}
.price-tag .unit,.price-tag .price-old,.cart-line-sub{font-size:10px}
.price-tag .price,.cart-line-total,.order-total{font-size:12px;font-weight:800}
.discount-flag{font-size:9px}
.empty-state p,.info-row,.faq-q,.akun-menu-btn,.faq-a,.legal-text,.account-guest-note,.retention-notice,.field input,.field textarea{font-size:12px}

/* ===== Keranjang & Checkout = tampilan CartScreen di zip ===== */
.sheet{background:var(--z-bg)}
.ct-store{display:flex;align-items:center;gap:6px;padding:2px 4px 8px;font-size:12px;font-weight:700;color:var(--z-ink)}
.ct-store .msym{font-size:18px;color:var(--z-red)}
.ct-item,.ct-card{background:#fff;border:1px solid var(--z-line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:12px}
.ct-item{display:flex;gap:10px;align-items:flex-start;padding:14px}
.ct-img{position:relative;width:80px;height:80px;flex:none;border-radius:8px;overflow:hidden;background:var(--z-bg);border:1px solid var(--z-line);display:flex;align-items:center;justify-content:center}
.ct-img img{width:100%;height:100%;object-fit:contain;padding:4px}
.ct-emo{font-size:34px;line-height:1}
.ct-img i{position:absolute;top:4px;left:4px;padding:2px 4px;border-radius:4px;background:var(--z-red);color:#fff;font-size:9px;font-weight:700;font-style:normal}
.ct-info{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between}
.ct-pkg{display:block;font-size:10px;color:var(--z-muted)}
.ct-info h5{margin:2px 0 0;font-size:12px;font-weight:700;line-height:1.25;color:var(--z-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-pr{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.ct-pr b{font-size:12px;font-weight:800;color:var(--z-red)}
.ct-pr s{font-size:10px;color:#916f6c}
.ct-act{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:4px;border-top:1px solid rgba(222,232,255,.5)}
.ct-del{border:none;background:none;display:flex;padding:0;color:var(--z-muted);transition:color var(--dur)}
.ct-del:hover{color:#ba1a1a}
.ct-del .msym{font-size:18px}
.ct-step{display:flex;align-items:center;padding:2px;border-radius:8px;background:var(--z-bg);border:1px solid var(--z-line)}
.ct-step button{width:24px;height:24px;border:none;border-radius:4px;background:#fff;color:var(--z-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ct-step button:disabled{opacity:.3}
.ct-step button .msym{font-size:14px}
.ct-step span{padding:0 10px;font-size:12px;font-weight:700;color:var(--z-ink)}
.ct-card{padding:14px;display:flex;flex-direction:column;gap:8px}
.ct-card h4{margin:0;padding-bottom:4px;border-bottom:1px solid rgba(222,232,255,.5);font-size:12px;font-weight:700;color:var(--z-ink)}
.ct-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--z-muted)}
.ct-row b{font-weight:600;color:var(--z-ink)}
.ct-row.red,.ct-row.red b{color:var(--z-red);font-weight:700}
.ct-row .msym{font-size:15px;margin-right:4px;vertical-align:middle}
.ct-total{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:8px 12px;border-radius:8px;background:var(--z-bg);border:1px solid var(--z-line)}
.ct-total strong{font-size:12px;font-weight:700;color:var(--z-ink)}
.ct-total .r{text-align:right}
.ct-total .r strong.red{font-size:14px;font-weight:800;color:var(--z-red)}
.ct-total p{margin:0;font-size:10px;color:var(--z-muted)}
.ct-total p.blue{color:var(--z-blue);font-weight:700}
.ct-bar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--z-line);box-shadow:0 8px 24px rgba(217,26,42,.18)}
.ct-bar>div{display:flex;flex-direction:column;min-width:0;padding-left:6px}
.ct-bar span{font-size:10px;color:var(--z-muted)}
.ct-bar strong{font-size:16px;font-weight:800;color:var(--z-red);line-height:1.3}
.ct-bar em{font-style:normal;font-size:9px;font-weight:700;color:var(--z-blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-go{flex:none;display:flex;align-items:center;gap:6px;border:none;border-radius:12px;padding:12px 16px;background:var(--z-red);color:#fff;font-size:12px;font-weight:700;box-shadow:0 4px 6px -1px rgba(0,0,0,.12);transition:background var(--dur)}
.ct-go:hover{background:var(--z-red2)}
.ct-go .msym{font-size:18px}
.dialog{border-radius:16px}
.method-toggle{gap:0;padding:4px;border-radius:12px;background:var(--z-bg);border:1px solid var(--z-line)}
.method-btn{border:none;border-radius:8px;padding:8px 6px;background:none;color:var(--z-muted)}
.method-btn[data-active="true"]{background:#fff;color:var(--z-blue);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.field input,.field textarea{background:var(--z-bg);border:1px solid var(--z-line);border-radius:8px;padding:8px 12px}
.field input:focus,.field textarea:focus{border-color:var(--z-blue)}
.checkout-summary{padding:8px 12px;border:1px solid var(--z-line);border-radius:8px;background:var(--z-bg);font-size:12px;font-weight:700}
.submit-btn{background:var(--z-red);color:#fff;border-radius:12px;padding:12px}
.submit-btn:disabled{opacity:.5}

/* ===== Tebus Murah: progress di mini-cart + pilihan di keranjang ===== */
.mini-cart{flex-wrap:wrap}
.mc-tebus{flex:0 0 100%;display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid rgba(255,255,255,.22)}
.mc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px}
.mc-txt{display:flex;align-items:center;gap:5px;min-width:0}
.mc-txt .msym{font-size:16px;color:#f6bf22;flex:none}
.mc-row>b{flex:none;font-size:11px;font-weight:800;color:#ffdf99}
.mc-bar{display:block;height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:999px;background:#f6bf22;transition:width .7s ease-out}
.mc-sub{font-size:9px;color:#ffefed}
.tb{margin:4px 0 12px}
.tb-banner{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:linear-gradient(to right,#8b6900,#6d5200,#8b6900);color:#fff0d7;box-shadow:0 4px 6px -1px rgba(0,0,0,.12)}
.tb-ic{width:36px;height:36px;flex:none;border-radius:999px;background:#f6bf22;color:#251a00;display:flex;align-items:center;justify-content:center}
.tb-ic .msym{font-size:20px}
.tb-banner i{display:inline-block;padding:1px 6px;border-radius:4px;background:#ffdf99;color:#251a00;font-size:9px;font-weight:900;font-style:normal;text-transform:uppercase}
.tb-banner p{margin:2px 0 0;font-size:12px;font-weight:700;color:#fff}
.tb-banner small{font-size:10px;color:#fff0d7}
.tb-row{display:flex;gap:10px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tb-row::-webkit-scrollbar{display:none}
.tb-card{flex:none;width:140px;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--z-line);box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column}
.tb-card.lock .tb-im{opacity:.55}
.tb-im{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--z-bg);display:flex;align-items:center;justify-content:center}
.tb-im img{width:100%;height:100%;object-fit:contain;padding:4px}
.tb-im i,.ct-img i.gold{position:absolute;top:4px;left:4px;padding:2px 4px;border-radius:4px;background:#8b6900;color:#fff;font-size:8px;font-weight:700;font-style:normal}
.tb-card h6{margin:6px 0 0;font-size:12px;font-weight:700;line-height:1.25;color:var(--z-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-pr{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.tb-pr b{font-size:12px;font-weight:800;color:var(--z-red)}
.tb-pr s{font-size:10px;color:#916f6c}
.tb-btn{margin-top:8px;width:100%;padding:6px 0;border:none;border-radius:8px;background:#d91a2a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tb-btn.on{background:#d5e3ff;color:#001c3b}
.tb-btn.off{background:var(--z-bg);color:var(--z-muted);font-size:10px}
.tb-btn .msym{font-size:14px}
.tb-tag{display:inline-block;padding:1px 6px;border-radius:4px;background:#ffdf99;color:#251a00!important;font-size:9px!important;font-weight:700;text-transform:uppercase}
.ct-pr em{font-style:normal;font-size:10px;font-weight:700;color:var(--z-blue);margin-left:4px}
.tb-max{padding:2px 8px;border-radius:6px;background:var(--z-line);color:var(--z-muted);font-size:10px;font-weight:700}
.ct-row.gold,.ct-row.gold b{color:#8b6900;font-weight:700}
.tb-empty{margin-top:8px;padding:10px 12px;border-radius:8px;background:#fff;border:1px dashed var(--z-line);font-size:11px;color:var(--z-muted);line-height:1.5}

/* ============================================================
   TAB PROMO — gaya PromoJSMScreen (proyek React referensi): hero merah + countdown,
   tracker Tebus Murah (emas), etalase tebus, bar ringkas keranjang, footer jaminan.
   ============================================================ */
.pm{display:flex;flex-direction:column;width:100%}
.pm-hero{position:relative;overflow:hidden;padding:16px;background:linear-gradient(to right,#b0001a,#d91a2a,#c0001e);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-hero-bg{position:absolute;right:-24px;bottom:-32px;font-size:160px;opacity:.15;pointer-events:none}
.pm-hero-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.pm-hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pm-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--z-gold);color:#251a00;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-tag .msym{font-size:15px}
.pm-store{display:inline-flex;align-items:center;gap:4px;min-width:0;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:11px;color:#fff}
.pm-store .msym{font-size:14px}
.pm-store span:last-child{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-hero h1{margin:4px 0 0;font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.02em;color:#fff}
.pm-hero p{margin:2px 0 0;font-size:12px;color:#ffefed}
.pm-end{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pm-end-l{display:flex;align-items:center;gap:8px;min-width:0}
.pm-end-ic{width:28px;height:28px;flex:none;border-radius:8px;background:#fff;color:var(--z-red);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-end-ic .msym{font-size:18px}
.pm-end-l small{display:block;font-size:10px;line-height:1.2;opacity:.9}
.pm-end-l b{display:block;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-cd{display:flex;align-items:center;gap:4px;flex:none;padding:4px 10px;border-radius:8px;background:rgba(38,49,67,.85);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-cd>.msym{font-size:16px;color:var(--z-gold);animation:pm-pulse 2s cubic-bezier(.4,0,.6,1) infinite}
.pm-cd-t{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.05em}
.pm-cd-t b{padding:2px 4px;border-radius:4px;background:rgba(255,255,255,.2)}
.pm-cd-t b:last-child{color:var(--z-gold)}
@keyframes pm-pulse{50%{opacity:.5}}
.pm-tabs{display:flex;align-items:center;gap:6px;padding:8px 16px;overflow-x:auto;background:rgba(255,255,255,.95);border-bottom:1px solid var(--z-line);scrollbar-width:none}
.pm-tabs::-webkit-scrollbar{display:none}
.pm-chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:none;border-radius:999px;background:var(--z-bg);color:var(--z-ink);font-size:12px;font-weight:700;white-space:nowrap;transition:background var(--dur),color var(--dur)}
.pm-chip:hover{background:var(--z-line)}
.pm-chip[data-active="true"]{background:var(--z-red);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-chip .msym{font-size:15px}
.pm-chip[data-active="true"] .msym{font-variation-settings:'FILL' 1}
.pm-sec{padding:12px 16px 0}
.pm-track{position:relative;overflow:hidden;padding:12px;border-radius:12px;background:linear-gradient(to bottom right,#ffdf99,#f6bf22,#ffdf99);border:1px solid rgba(246,191,34,.5);color:#251a00;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-track h2{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;color:#251a00}
.pm-track h2 .msym{font-size:22px;color:var(--z-red)}
.pm-track>p{margin:6px 0 0;font-size:11px;line-height:1.35}
.pm-track-card{margin-top:6px;padding:10px;border-radius:8px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:4px}
.pm-track-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.pm-track-row>span{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--z-ink)}
.pm-track-row .msym{font-size:16px;color:var(--z-blue)}
.pm-track-row b{font-weight:800;color:var(--z-red)}
.pm-bar{width:100%;height:8px;border-radius:999px;background:var(--z-line);overflow:hidden}
.pm-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(to right,#0c5fae,#b0001a);transition:width .3s}
.pm-track-st{display:flex;align-items:center;gap:4px;padding-top:2px;font-size:11px;font-weight:700;color:var(--z-muted)}
.pm-track-st.ok{color:var(--z-blue)}
.pm-track-st .msym{font-size:15px}
.pm-cat{padding:16px 16px 0}
.pm-cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pm-cat-head h2{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;font-weight:700;color:var(--z-ink)}
.pm-cat-head h2 i{width:6px;height:16px;border-radius:999px;background:var(--z-red)}
.pm-cat-head>span{font-size:11px;color:var(--z-muted)}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm-card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--z-line);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-card-im{position:relative;width:100%;aspect-ratio:1/1;margin-bottom:6px;border-radius:8px;overflow:hidden;background:var(--z-bg);display:flex;align-items:center;justify-content:center;font-size:40px}
.pm-card-im img{width:100%;height:100%;object-fit:contain;padding:8px}
.pm-card-im i{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:4px;background:var(--z-red);color:#fff;font-size:9px;font-weight:700;font-style:normal;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-card h3{margin:0;min-height:30px;font-size:12px;font-weight:700;line-height:1.25;color:var(--z-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm-card small{display:block;font-size:10px;color:var(--z-muted)}
.pm-card-pr{margin-top:4px;display:flex;flex-direction:column}
.pm-card-pr b{font-size:12px;font-weight:800;color:var(--z-red)}
.pm-card-pr s{font-size:10px;color:#916f6c}
.pm-card-st{margin-top:6px;text-align:right;font-size:9px;color:var(--z-muted)}
.pm-card-add{margin-top:10px;width:100%;height:32px;display:flex;align-items:center;justify-content:center;gap:4px;border:none;border-radius:8px;background:var(--z-bg);color:var(--z-red);font-size:12px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background var(--dur),color var(--dur)}
.pm-card-add:hover{background:var(--z-red);color:#fff}
.pm-card-add .msym{font-size:16px}
.pm-et{padding:20px 16px 12px}
.pm-et-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:10px;border-radius:12px;background:linear-gradient(to right,#dee8ff,#d5e3ff);border:1px solid var(--z-line);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-et-l{display:flex;align-items:center;gap:8px;min-width:0}
.pm-et-ic{width:32px;height:32px;flex:none;border-radius:999px;background:var(--z-gold);color:#251a00;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pm-et-ic .msym{font-size:20px}
.pm-et-head h2{margin:0;font-size:12px;font-weight:800;line-height:1.2;color:var(--z-ink)}
.pm-et-head p{margin:0;font-size:10px;color:var(--z-muted)}
.pm-et-max{flex:none;padding:2px 8px;border-radius:6px;background:var(--z-red);color:#fff;font-size:10px;font-weight:700}
.pm-list{display:flex;flex-direction:column;gap:8px}
.pm-item{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--z-line);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background var(--dur),border-color var(--dur)}
.pm-item.on{background:rgba(255,218,215,.4);border-color:var(--z-red)}
.pm-item.lock .pm-item-im{opacity:.55}
.pm-item-im{position:relative;width:64px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:var(--z-bg);display:flex;align-items:center;justify-content:center}
.pm-item-im img{width:100%;height:100%;object-fit:contain;padding:4px}
.pm-item-im i{position:absolute;top:4px;left:4px;padding:1px 4px;border-radius:4px;background:#8b6900;color:#fff;font-size:8px;font-weight:700;font-style:normal}
.pm-item-bd{flex:1;min-width:0}
.pm-item-ok{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--z-blue)}
.pm-item-ok .msym{font-size:13px}
.pm-item h3{margin:0;font-size:12px;font-weight:700;color:var(--z-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-item-pr{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.pm-item-pr b{font-size:12px;font-weight:900;color:var(--z-red)}
.pm-item-pr s{font-size:10px;color:#916f6c}
.pm-item small{display:block;margin-top:2px;font-size:9px;color:var(--z-muted)}
.pm-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 12px;border:none;border-radius:8px;background:var(--z-line);color:var(--z-red);font-size:12px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background var(--dur),color var(--dur)}
.pm-btn:hover{background:var(--z-red);color:#fff}
.pm-btn.on{background:var(--z-red);color:#fff}
.pm-btn.off,.pm-btn.off:hover{max-width:84px;background:var(--z-bg);color:var(--z-muted);font-size:10px;line-height:1.25;text-align:center;box-shadow:none;cursor:not-allowed}
.pm-btn .msym{font-size:14px}
.pm-foot{margin:12px 16px 0;display:flex;align-items:center;justify-content:space-around;text-align:center;padding:10px;border-radius:12px;background:var(--z-bg);border:1px solid var(--z-line)}
.pm-foot>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.pm-foot .msym{font-size:20px}
.pm-foot>div>span:last-child{font-size:10px;font-weight:600;color:var(--z-ink)}
.pm-foot i{width:1px;height:24px;background:var(--z-line)}
.pm-c-blue{color:var(--z-blue)}.pm-c-red{color:var(--z-red)}.pm-c-gold{color:#8b6900}
/* ---------- Detail Produk (gaya Alfagift) ---------- */
[data-action="open-product"]{cursor:pointer}
.dt{position:fixed;inset:0;z-index:45;display:none;justify-content:center}
.dt[data-open="true"]{display:flex}
.dt-backdrop{position:absolute;inset:0;background:rgba(20,12,6,.45)}
.dt-page{position:relative;width:100%;max-width:460px;height:100%;background:#fff;color:var(--z-ink);display:flex;flex-direction:column;animation:dtIn var(--dur) ease-out}
@keyframes dtIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dt-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.dt-top>div{display:flex;gap:8px}
.dt-btn{pointer-events:auto;position:relative;width:38px;height:38px;border:none;border-radius:999px;background:rgba(120,120,120,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.dt-btn .msym{font-size:22px}
.dt-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:96px}
.dt-hero{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff}
.dt-hero img{width:100%;height:100%;object-fit:contain;padding:56px 24px 16px}
.dt-hero img~.dt-emo{display:none}
.dt-emo{font-size:96px;line-height:1}
.dt-gap{height:8px;background:#f0f0f0}
.dt-info{padding:16px}
.dt-tags{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700}
.dt-ship{display:inline-flex;align-items:center;gap:4px;color:var(--z-red)}
.dt-ship .msym{font-size:15px}
.dt-stok{padding:2px 8px;border-radius:999px;background:#e6f4ea;color:#166534}
.dt-stok.low{background:#fff1d6;color:#8b5a00}
.dt-stok.out{background:#fde2e2;color:var(--z-red)}
.dt-namerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:6px}
.dt-namerow h1{margin:0;font-size:18px;font-weight:500;line-height:1.3}
.dt-fav{flex:none;border:none;background:none;padding:2px;color:var(--z-blue)}
.dt-fav .msym{font-size:26px}
.dt-fav .fill{color:var(--z-red2)}
.dt-pricerow{display:flex;align-items:center;gap:8px;margin-top:12px;padding-bottom:16px;border-bottom:1px dashed #cfcfcf}
.dt-pricerow b{font-size:24px;font-weight:800;color:#000}
.dt-pricerow i{font-style:normal;padding:4px 10px;border-radius:6px;background:var(--z-red2);color:#fff;font-size:13px;font-weight:800}
.dt-pricerow s{color:#8a8a8a;font-size:14px}
.dt-promo{background:#f0f0f0;padding:16px}
.dt-promo:empty{display:none}
.dt-promo h2,.dt-sec h2{margin:0 0 12px;font-size:16px;font-weight:800}
.dt-pcard{margin-bottom:12px;border-radius:14px;background:linear-gradient(135deg,#fff0a8,#ffe08a 60%,#fff6cf);overflow:hidden}
.dt-pcard:last-child{margin-bottom:0}
.dt-pcard-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;color:var(--z-red);font-size:16px}
.dt-rp{width:28px;height:28px;flex:none;border-radius:999px;background:var(--z-red);color:#fff;display:flex;align-items:center;justify-content:center}
.dt-rp .msym{font-size:16px}
.dt-rp.sm{width:22px;height:22px}
.dt-rp.sm .msym{font-size:13px}
.dt-pcard-b{display:flex;align-items:center;gap:10px;margin:0 10px 10px;padding:12px;background:#fff;border:1px solid #e3e3e3;border-radius:10px}
.dt-pcard-b div{flex:1;min-width:0}
.dt-pcard-b b{display:block;font-size:14px;font-weight:700}
.dt-pcard-b small{color:#666;font-size:13px}
.dt-tbtn{flex:none;border:none;border-radius:999px;padding:6px 14px;background:var(--z-blue);color:#fff;font-size:12px;font-weight:700}
.dt-tbtn:disabled{background:#d9d9d9;color:#777}
.dt-tbtn.on{background:#16a34a}
.dt-sec{padding:16px}
.dt-sec dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.dt-sec dt{color:#666}
.dt-sec dd{margin:0;font-weight:600}
.dt-bar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.dt-cta{flex:1;height:48px;border:none;border-radius:8px;background:var(--z-blue);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.dt-cta small{font-size:12px;font-weight:600;opacity:.9}
.dt-cta:disabled{background:#c9c9c9}
.dt-cta.alt{flex:none;padding:0 16px;background:#fff;color:var(--z-blue);border:1px solid var(--z-blue);font-size:15px}
#dt-topping:empty{display:none}
.dt-sec h2 small{font-size:12px;font-weight:500;color:#666}
.tp-list{display:flex;flex-direction:column;gap:8px}
.tp-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid #e3e3e3;border-radius:10px;background:#fff;text-align:left;font-size:14px}
.tp-row.on{border-color:var(--z-blue);background:#eef4ff}
.tp-row:disabled{opacity:.5}
.tp-chk{flex:none;width:22px;height:22px;border:2px solid #b8c2d3;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff}
.tp-chk .msym{font-size:18px}
.tp-row.on .tp-chk{background:var(--z-blue);border-color:var(--z-blue)}
.tp-nm{flex:1;min-width:0;font-weight:600}
.tp-nm em{font-style:normal;font-weight:500;color:#999}
.tp-row b{flex:none;font-size:13px;color:var(--z-blue)}
.ct-top{margin:2px 0 4px;font-size:12px;line-height:1.4;color:#666}
.dt-step{flex:none;display:flex;align-items:center;gap:4px;height:48px;padding:0 6px;border:1px solid #cfd8e6;border-radius:8px}
.dt-step button{width:34px;height:34px;border:none;background:none;color:var(--z-blue);display:flex;align-items:center;justify-content:center}
.dt-step button:disabled{opacity:.3}
.dt-step .msym{font-size:22px}
.dt-step b{min-width:24px;text-align:center;font-size:16px}
.hm-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hm-hero-shade{position:absolute;inset:0;background:linear-gradient(to right,rgba(120,0,15,.88),rgba(0,0,0,.2))}
.hm-hero-body.img-only{min-height:132px;cursor:pointer}
.admin-promo-img{display:flex;align-items:center;gap:10px;margin-top:8px}
.admin-promo-img>img,.admin-promo-img>span{width:88px;height:44px;flex:none;border-radius:6px;object-fit:cover;background:#fff;border:1px solid var(--z-line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--z-muted);text-align:center}
.admin-promo-img>div{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.admin-promo{margin-bottom:10px;padding:10px;border:1px solid var(--z-line);border-radius:10px;background:var(--z-bg)}
.admin-promo-h{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.admin-promo input{display:block;width:100%;margin-top:6px}
.admin-jj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
.admin-jj-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--z-line);border-radius:10px;background:var(--z-bg);text-align:center}
.admin-jj-prev{width:48px;height:48px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.admin-jj-prev img{width:100%;height:100%;object-fit:cover}
.admin-jj-prev .msym{font-size:24px}
.admin-jj-item b{font-size:11.5px;font-weight:700;color:var(--z-ink)}
.poin-row{display:flex;gap:8px;align-items:center}
.poin-row input{flex:1;min-width:0}
.poin-row .btn-outline{flex:none;white-space:nowrap}
.ct-poin h4{display:flex;align-items:center;gap:6px}
.ct-poin h4 .msym{font-size:18px;color:var(--z-red)}
.ct-poin h4 small{margin-left:auto;font-size:11px;font-weight:600;color:var(--z-muted)}
.ct-poin input{height:40px;padding:0 12px;border:1px solid var(--z-line);border-radius:10px;background:#fff;font-size:14px}

/* ---------- Lacak & Struk Belanja (halaman penuh setelah Kirim Pesanan) ---------- */
.trk-overlay{background:#f2f2f2;z-index:60}
.trk-page{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100%;max-width:460px;height:100%;overflow-y:auto;background:#f2f2f2;padding-bottom:24px}
.trk-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:#fff;padding:10px 12px;border-bottom:1px solid #e5e5e5}
.trk-back{border:none;background:none;padding:4px;color:hsl(var(--ink));display:flex}
.trk-ttl{flex:1;min-width:0;font-size:13px;font-weight:800;line-height:1.25}
.trk-ttl small{display:block;font-size:10px;font-weight:600;color:hsl(var(--ink-soft));word-break:break-all}
.trk-sync{max-width:46%;font-size:9.5px;font-weight:700;line-height:1.25;border-radius:8px;padding:5px 8px;color:hsl(var(--green));background:hsl(var(--green)/.12);border:1px solid hsl(var(--green)/.35)}
.trk-sync[data-ok="false"]{color:#8a5a00;background:#fff4d6;border-color:#f0c96a}
.trk-card{background:#fff;margin:8px 10px;border-radius:10px;padding:12px;box-shadow:var(--shadow-sm)}
.trk-eta{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:hsl(var(--red))}
.trk-eta .msym{font-size:18px}
.trk-steps{display:flex;margin:14px 0 4px}
.trk-step{flex:1;text-align:center;position:relative;font-size:9.5px;font-weight:700;color:hsl(var(--ink-soft))}
.trk-step:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:#ddd}
.trk-step[data-done="true"]:not(:last-child)::after{background:hsl(var(--red))}
.trk-dot{width:28px;height:28px;border-radius:999px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;border:2px solid #ddd;background:#fff;color:#aaa}
.trk-dot .msym{font-size:15px}
.trk-step[data-done="true"]{color:hsl(var(--ink))}
.trk-step[data-done="true"] .trk-dot{background:hsl(var(--red));border-color:hsl(var(--red));color:#fff}
.trk-cancel{display:flex;align-items:center;gap:8px;color:hsl(var(--red));font-size:12px;font-weight:800}
.trk-courier{display:flex;align-items:center;gap:10px}
.trk-avatar{width:36px;height:36px;border-radius:999px;background:hsl(var(--red)/.1);color:hsl(var(--red));display:flex;align-items:center;justify-content:center;flex:none}
.trk-cinfo{flex:1;min-width:0;font-size:12px;font-weight:800}
.trk-cinfo small{display:block;font-size:10.5px;font-weight:600;color:hsl(var(--ink-soft))}
.trk-ic{width:34px;height:34px;border-radius:999px;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;color:hsl(var(--red));background:#fff;flex:none}
.trk-ic .msym{font-size:18px}
.trk-rc{font-family:var(--f-sans);text-align:center}
.trk-tag{display:inline-block;background:hsl(var(--red));color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:3px}
.trk-store{font-size:14px;font-weight:800;margin-top:6px}
.trk-sub{font-size:10px;color:hsl(var(--ink-soft));margin-top:2px;line-height:1.5}
.trk-bar{margin:12px 0 4px;border:1px dashed #ccc;border-radius:8px;padding:10px 10px 6px}
.trk-bar svg{width:100%;height:56px;display:block}
.trk-bar b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;margin-top:4px}
.trk-hint{font-size:10px;color:hsl(var(--ink-soft));margin:4px 0 10px}
.trk-dark{width:100%;border:none;border-radius:8px;padding:11px;background:#1c1c1c;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.trk-list{text-align:left;font-size:12px;margin-top:14px}
.trk-list h3{font-size:12px;font-weight:800;margin:0 0 8px}
.trk-row{display:flex;justify-content:space-between;gap:10px;margin:5px 0;font-size:11.5px}
.trk-row span:last-child{font-weight:700;text-align:right}
.trk-item small{display:block;font-size:10px;font-weight:500;color:hsl(var(--ink-soft))}
.trk-total{border-top:1px dashed #ccc;margin-top:8px;padding-top:8px;font-size:13px;font-weight:800}
.trk-total span:last-child{color:hsl(var(--red))}
.trk-poin{display:flex;align-items:center;gap:8px;border:1px solid #f0d27a;background:#fff8e1;border-radius:8px;padding:9px 10px;margin-top:10px;font-size:11.5px;font-weight:800}
.trk-poin em{margin-left:auto;font-style:normal;color:hsl(var(--gold-ink))}
.trk-addr{text-align:left;margin-top:10px;border:1px solid #eee;background:#fafafa;border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.5}
.trk-addr b{display:block;font-size:10px;letter-spacing:.05em;color:hsl(var(--ink-soft))}
.trk-addr i{display:block;font-size:10px;color:hsl(var(--red))}
.trk-again{display:block;width:calc(100% - 20px);margin:8px 10px 0;border:none;border-radius:8px;padding:13px;background:hsl(var(--red));color:#fff;font-size:12px;font-weight:800}
.loc-opt{display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:700;margin:0 0 12px;cursor:pointer}
.loc-opt input{margin-top:2px;accent-color:hsl(var(--red))}
.loc-opt small{display:block;font-size:10.5px;font-weight:500;color:hsl(var(--ink-soft))}
.trk-loc{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;border:1px solid hsl(var(--green)/.4);background:hsl(var(--green)/.08);color:hsl(var(--green));border-radius:8px;padding:9px 10px;font-size:11px;font-weight:800;text-align:left}
.trk-loc a{margin-left:auto;color:inherit;text-decoration:underline}
.trk-loc[data-miss="true"]{border-color:#f0c96a;background:#fff4d6;color:#8a5a00}
/* ============================================================
   TEMA ALFAGIFT — header merah gradasi, latar aplikasi abu-putih bersih.
   Ditaruh PALING AKHIR supaya menimpa token kraft-paper di atas.
   Ganti warna cukup lewat variabel di blok :root ini. */
:root{
  --paper:0 0% 100%; --paper-mid:225 25% 96%; --paper-deep:228 25% 96%; --paper-line:224 16% 89%;
  --red:358 82% 48%;
  --z-red:#d9141a; --z-red2:#e8262c; --z-bg:#f5f6fa; --z-line:#e6e8ef; --z-muted:#6b7280;
}
body{background:hsl(var(--paper-deep))}

/** Katalog TIDAK LAGI hardcode di sini — diambil live dari backend ERP

let PRODUCTS = [];

/* Promo banner beranda — kosongkan jika belum ada promo berjalan. */
const PROMOS = [];
/* Teks hero tab Promo. judul kosong = otomatis "PROMO " + nama toko. Banner countdown-nya
   TIDAK diisi di sini: tampil sendiri kalau promo Tebus Murah aktif punya tanggal berakhir. */

/* Gambar banner beranda (kanan). Kosongkan '' untuk pakai ikon keranjang saja. */
