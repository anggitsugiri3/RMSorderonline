/* contoh isi: { judul:"GRATIS ONGKIR", sub:"Belanja tanpa syarat, diantar tanpa biaya", periode:"Berlaku tiap hari" } */

/* ================================================================
   BACKEND — koneksi ke Anini Retail ERP (Google Apps Script doPost)
   ================================================================ */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxlyManslLRkZdiuxkHGcQCJa3Efpgqc_Zn1vFfdPqtmkzRFOvoby8hcGOB4LfHQjGK/exec';

/* Opsi untuk aksi BACA (aman diulang): katalog, tebus, pengaturan toko. Apps Script kadang
   lambat bangun (cold start), balas halaman error HTML, atau menolak karena terlalu banyak
   eksekusi paralel - itu penyebab "kadang error / kadang lama". Diulang otomatis, timeout
   per percobaan lebih pendek biar percobaan berikutnya cepat jalan. JANGAN dipakai untuk aksi
   TULIS (buat pesanan, login, daftar, batal) - default api() TIDAK mengulang. */
const API_READ = { retries: 2, timeoutMs: 15000 };
const API_RETRY_DELAY_MS = [500, 1500];

async function apiOnce_(action, params, timeoutMs) {
  const controller = new AbortController();
  const timeoutId = setTimeout(function () { controller.abort(); }, timeoutMs);
  let res;
  try {
    res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight (GAS doPost tidak menangani OPTIONS)
      body: JSON.stringify({ action: action, params: params || {} }),
      signal: controller.signal
    });
  } catch (e) {
    const err = new Error(e.name === 'AbortError'
      ? 'Server tidak merespon (timeout). Coba lagi.'
      : 'Gagal terhubung ke server. Cek koneksi internet kamu.');
    err.retryable = navigator.onLine !== false; // offline beneran = jangan buang waktu mengulang
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }
  let json;
  try { json = await res.json(); }
  catch (e) {
    const err = new Error('Server mengembalikan respon tidak valid.');
    err.retryable = true; // biasanya halaman error/kuota Apps Script sesaat
    throw err;
  }
  if (!json.success) throw new Error(json.message || 'Terjadi kesalahan pada server.'); // error bisnis: tidak diulang
  return json.data;
}

async function api(action, params, opts) {
  opts = opts || {};
  const retries = opts.retries || 0;
  const timeoutMs = opts.timeoutMs || 25000;
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    if (attempt > 0) await new Promise(function (r) { setTimeout(r, API_RETRY_DELAY_MS[attempt - 1] || 1500); });
    try {
      return await apiOnce_(action, params, timeoutMs);
    } catch (e) {
      lastErr = e;
      if (!e.retryable) throw e;
    }
  }
  throw lastErr;
}

/**
 * Emoji fallback kalau produk belum punya Foto di server. Produk retail biasa tetap
 * 🛒; produk kategori Jajanan (Seblak/Bakaran/Kopi/Es Teh/dll) ditebak dari nama produk.
 */
function emojiProduk(nama, kategori) {
  if (!isJajananKategori(kategori)) return '🛒';
  const n = String(nama || '').toLowerCase();
  if (/seblak|mie|bakso|soto|ramen/.test(n)) return '🍲';
  if (/sate|bakar|tusuk/.test(n)) return '🍢';
  if (/kopi|latte|espresso|cappuccino/.test(n)) return '☕';
  if (/teh|es |jus|susu|cokelat|coklat/.test(n)) return '🧊';
  return '🍜';
}

/**
 * Ubah bentuk produk dari backend (apiKatalogProdukPublik: Id/Nama/HargaJual/
 * Stok/KategoriNama/Satuan/Foto) ke bentuk yang dipakai render di file ini.
 * @param {Object} p
 */
function mapProdukPublik(p) {
  return {
    id: p.Id,
    nama: p.Nama,
    kategori: p.KategoriNama || 'Lainnya',
    harga: Number(p.HargaJual) || 0,
    satuan: p.Satuan || '',
    stok: Number(p.Stok) || 0,
    emoji: emojiProduk(p.Nama, p.KategoriNama),
    gambar: p.Foto || null,
    diskonPersen: 0,
    unggulan: false
  };
}

/**
 * Muat produk Tebus Murah dari server kasir (action apiTebusMurahPublik, terdaftar di
 * whitelist doPost Code.js -> TebusMurahPublikController.js). Server sudah menyaring
 * promo aktif, produk nonaktif & stok habis, jadi client tinggal memetakan hasilnya.
 * Kalau gagal, alasan disimpan di state.tebusError dan tampil di keranjang + tombol
 * "Coba lagi".
 */
async function loadTebus(){
  state.tebusError = null;   // daftar TEBUS lama sengaja TIDAK dikosongkan di sini - tetap tampil sampai data baru datang
  try{
    const td = await api('apiTebusMurahPublik', {}, API_READ);
    const arr = Array.isArray(td) ? td : (td && Array.isArray(td.data) ? td.data : []);
    TEBUS = arr.map(mapTebus).filter(t=>t.id && t.harga>0);
  }catch(e){
    console.warn('apiTebusMurahPublik gagal:', e);
    if(!TEBUS.length) state.tebusError = e.message || 'tidak diketahui';   // punya data lama = diam-diam pakai itu
  }
}

/* Waktu terakhir katalog sukses ditarik dari server (ms epoch) - dipakai throttle
   refreshKatalogSenyap(). */
let katalogTerakhirMs = 0, katalogSenyapBusy = false;
const KATALOG_SENYAP_MIN_MS = 30000;

/* Cache katalog di device (stale-while-revalidate): buka app -> katalog TERAKHIR langsung
   tampil dari sini (tanpa nunggu Apps Script), lalu ditimpa data segar begitu server jawab.
   Yang disimpan data mentah server (bukan hasil mapProdukPublik) supaya aturan kategori/emoji
   selalu ikut versi kode terbaru. Kadaluarsa 3 hari; localStorage penuh/diblok = diabaikan. */
const KATALOG_CACHE_KEY = 'ainiMartKatalogV1';
const KATALOG_CACHE_MAX_AGE_MS = 3 * 24 * 3600 * 1000;
function bacaKatalogCache_() {
  try {
    const o = JSON.parse(localStorage.getItem(KATALOG_CACHE_KEY) || 'null');
    if (o && Array.isArray(o.data) && o.data.length && (Date.now() - o.t) < KATALOG_CACHE_MAX_AGE_MS) return o;
  } catch (e) {}
  return null;
}
function simpanKatalogCache_(data) {
  try { localStorage.setItem(KATALOG_CACHE_KEY, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
}
/** Pasang data katalog dari server sebagai PRODUCTS + simpan cache. */
function terapkanKatalog_(data) {
  data = Array.isArray(data) ? data : [];
  PRODUCTS = data.map(mapProdukPublik);
  katalogTerakhirMs = Date.now();
  simpanKatalogCache_(data);
}

/**
 * Tarik ulang katalog dari server kasir TANPA layar "Memuat..." - dipanggil tiap tab
 * Jajanan dibuka (menu & stok jajanan gampang berubah). Tampilan lama tetap kelihatan,
 * baru diganti begitu server jawab. Gagal = diam-diam pakai data lama. Dibatasi 1x per
 * 30 detik supaya bolak-balik tab tidak membanjiri Apps Script.
 */
async function refreshKatalogSenyap() {
  if (katalogSenyapBusy || state.katalogLoading || state.katalogError) return;
  if (Date.now() - katalogTerakhirMs < KATALOG_SENYAP_MIN_MS) return;
  katalogSenyapBusy = true;
  try {
    terapkanKatalog_(await api('apiKatalogProdukPublik', {}, { retries: 1, timeoutMs: 15000 }));
    renderTabContent();
    renderMiniCart();
  } catch (e) {
    console.warn('Refresh katalog Jajanan gagal, pakai data lama:', e.message);
  } finally {
    katalogSenyapBusy = false;
  }
}

/**
 * Load katalog produk publik dari backend. Dipanggil sekali saat init, setelah pesanan
 * sukses, dan boleh dipanggil ulang manual (retry) kalau gagal.
 *
 * Urutan (supaya terasa cepat):
 * 1. Kalau PRODUCTS masih kosong tapi ada cache di device -> tampilkan cache SEKARANG juga.
 *    Layar "Memuat katalog..." cuma muncul kalau memang belum ada data sama sekali
 *    (kunjungan pertama).
 * 2. Katalog & Tebus Murah diminta BARENGAN (dulu Tebus menunggu katalog selesai dulu, jadi
 *    waktu tunggu dobel, dan katalog baru tampil setelah dua-duanya kelar).
 * 3. Katalog langsung dirender begitu datang; Tebus dirender menyusul kapan pun selesai.
 * 4. Gagal + sudah ada data (cache/sebelumnya) = diam-diam pakai data itu, tanpa layar error.
 */
async function loadKatalog() {
  state.katalogError = null;
  if (!PRODUCTS.length) {
    const cache = bacaKatalogCache_();
    if (cache) PRODUCTS = cache.data.map(mapProdukPublik);
  }
  state.katalogLoading = PRODUCTS.length === 0;
  renderTabContent();
  if (PRODUCTS.length) renderMiniCart();

  const tebusP = loadTebus();
  try {
    terapkanKatalog_(await api('apiKatalogProdukPublik', {}, API_READ));
    state.katalogLoading = false;
  } catch (e) {
    state.katalogLoading = false;
    if (PRODUCTS.length) console.warn('Katalog gagal diperbarui, pakai data yang ada:', e.message);
    else state.katalogError = e.message || 'Gagal memuat katalog produk.';
  }
  updateStatusPill();
  renderTabContent();
  renderMiniCart();

  tebusP.then(function () {
    renderTabContent();
    renderMiniCart();
    if (state.cartOpen) renderCartBody();
  });
}

/**
 * Terapkan STORE.nama/logo/whatsapp terbaru ke elemen header yang sudah
 * ada di DOM, tanpa render ulang seluruh shell (biar dialog/tab yang lagi
 * kebuka gak keganggu). Dipanggil setelah loadPengaturanToko() sukses, dan

  if(mark) mark.innerHTML = STORE.logo ? '<img src="'+esc(STORE.logo)+'" alt="'+esc(STORE.nama)+'">' : esc(STORE.nama.charAt(0));

  if(waLink) waLink.href = 'https://wa.me/'+STORE.whatsapp+'?text='+encodeURIComponent('Halo '+STORE.nama+', saya mau tanya-tanya.');
  updateStatusPill();

/**
 * Ambil pengaturan toko TERBARU dari server (Sheet/Properties di Apps
 * Script - lihat action 'pengaturanTokoPublik'). Dipanggil sekali tiap app
 * dibuka, SETELAH renderShell() supaya user tetap lihat sesuatu (nilai
 * default/cache) duluan sebelum data server sampai - baru begitu server
 * jawab, header ditimpa ke nilai terkini. Kalau server gak bisa dihubungi
 * (offline dsb), app tetap jalan pakai nilai default di STORE, gak nge-block.
 */
async function loadPengaturanToko(){
  try{
    const s = await api('pengaturanTokoPublik', {}, API_READ);
    if(!s) return;
    if(s.nama) STORE.nama = s.nama;
    if(s.whatsapp) STORE.whatsapp = s.whatsapp;
    if(s.alamat) STORE.alamat = s.alamat;
    STORE.logo = s.logo || ''; // logo boleh kosong (admin hapus logo) beda dari "belum ada data"
    if(s.promo != null){ const pr = normPromos(s.promo); setPromos(pr); savePromosLocal(pr); }
    if(s.jajananIcons != null){
      try{
        const obj = typeof s.jajananIcons==='string' ? JSON.parse(s.jajananIcons) : s.jajananIcons;
        if(obj && typeof obj==='object'){ JAJANAN_ICONS = obj; saveJajananIconsLocal(obj); }
      }catch(e){}
    }
    applyStoreBranding();
    if(state.tab==='beranda') renderTabContent(); // icon jajanan bisa berubah dari server, refresh kalau lagi kelihatan
  }catch(e){
    console.warn('Gagal muat pengaturan toko dari server, pakai nilai default:', e.message);
  }
}

/* ================================================================
   AUTO-TRIM FOTO PRODUK
   Banyak foto produk (mis. dari CDN yoline.co.id) disimpan di kanvas
   lebar (contoh: 1280x720) dengan padding putih raksasa di kiri-kanan,
   sementara objek produknya sendiri cuma nempatin sepertiga tengah.
   Akibatnya di kotak thumbnail kotak persegi tetap keliatan "kosong"
   walau CSS sudah object-fit:contain - karena bukan CSS yang salah,
   pixel putihnya memang bagian dari file.
   Fungsi ini baca pixel via <canvas>, cari bounding-box konten asli
   (buang tepi yang mendekati putih/transparan), lalu ganti src gambar
   jadi versi ter-crop. Kalau server gambar gak kirim header CORS,
   canvas jadi "tainted" dan baca pixel gagal - di-tangkap, otomatis
   balik pakai gambar asli (gak pernah bikin gambar rusak/blank).
   ================================================================ */
const trimCache = new Map(); // "url|maxLen" -> Promise<string> (dataURL hasil crop, atau url asli kalau gagal/gak perlu)
function getTrimmedImage(url, maxLen){
  if(!url) return Promise.resolve(url);
  const cap = maxLen || 250000; // generik buat tampilan (longgar); upload foto produk kirim cap lebih ketat sendiri
  const cacheKey = url+'|'+cap;
  if(trimCache.has(cacheKey)) return trimCache.get(cacheKey);
  const p = new Promise((resolve)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try{
        const w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h) { resolve(url); return; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, w, h).data; // lempar error kalau canvas tainted (CORS)
        let minX=w, minY=h, maxX=-1, maxY=-1;
        const step = Math.max(1, Math.floor(Math.max(w,h)/600)); // sampling biar gambar gede tetap cepat
        for(let y=0;y<h;y+=step){
          for(let x=0;x<w;x+=step){
            const i=(y*w+x)*4, r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
            const bg = a<10 || (r>244 && g>244 && b>244);
            if(!bg){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
          }
        }
        if(maxX<minX || maxY<minY){ resolve(url); return; } // gagal deteksi konten -> gambar asli
        const padX = Math.round((maxX-minX)*0.04)+step, padY = Math.round((maxY-minY)*0.04)+step;
        minX = Math.max(0,minX-padX); minY = Math.max(0,minY-padY);
        maxX = Math.min(w-1,maxX+padX); maxY = Math.min(h-1,maxY+padY);
        const cw = maxX-minX+1, ch = maxY-minY+1;
        if(cw >= w*0.94 && ch >= h*0.94 && !maxLen){ resolve(url); return; } // udah tight & gak ada budget ketat -> gambar asli, hemat kerjaan
        const out = document.createElement('canvas');
        out.width = cw; out.height = ch;
        const octx = out.getContext('2d');
        octx.fillStyle = '#fff'; octx.fillRect(0,0,cw,ch); // alas putih - JPEG gak dukung transparan, konsisten sama compressImage()
        octx.drawImage(cv, minX, minY, cw, ch, 0, 0, cw, ch);
        // JPEG (bukan PNG) + loop turunin kualitas: foto asli bisa kompleks/besar, PNG bakal
        // lebih gede dari input yang udah dikompres. Dijamin muat di bawah `cap` (dipakai
        // upload foto produk supaya aman di batas ~50rb karakter 1 cell Google Sheets).
        let q = .85, res = out.toDataURL('image/jpeg', q);
        while(res.length > cap && q > .35){ q -= .1; res = out.toDataURL('image/jpeg', q); }
        resolve(res);
      }catch(e){ resolve(url); } // CORS taint / error lain -> fallback gambar asli, diam-diam
    };
    img.onerror = function(){ resolve(url); };
    img.src = url;
  });
  trimCache.set(cacheKey, p);
  return p;
}
function applyTrimmedThumb(url){
  if(!url) return;
  getTrimmedImage(url).then(function(trimmed){
    if(trimmed===url) return;
    document.querySelectorAll('[data-thumb-src="'+CSS.escape(url)+'"]').forEach(function(el){
      if(el.tagName==='IMG') el.src = trimmed; else el.style.backgroundImage = 'url("'+trimmed+'")';
    });
  });
}

/* Session member disimpan di localStorage supaya login gak hilang tiap buka
 * app lagi (khas PWA). Cuma nyimpen id/nama/wa - TIDAK pernah simpan PIN di
 * sisi client. */
const AUTH_STORAGE_KEY = 'ainiMartMemberSession';
const AUTH_PERNAH_KEY = 'ainiMartPernahMember';   // penanda "device ini pernah login member" - dipakai supaya dialog Masuk tidak muncul lagi
/* Cadangan di cookie (400 hari): kalau localStorage kosong/terhapus tapi cookie masih ada, sesi dipulihkan otomatis. */
function setCookie_(k, v, days){
  try{ document.cookie = k+'='+encodeURIComponent(v)+'; max-age='+Math.round(days*86400)+'; path=/; SameSite=Lax'+(location.protocol==='https:' ? '; Secure' : ''); }catch(e){}
}
function getCookie_(k){
  try{ const m = document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; }catch(e){ return null; }
}
function saveAuthSession(pelanggan){
  const json = JSON.stringify(pelanggan);
  try{ localStorage.setItem(AUTH_STORAGE_KEY, json); localStorage.setItem(AUTH_PERNAH_KEY, '1'); }catch(e){}
  setCookie_(AUTH_STORAGE_KEY, json, 400);
  setCookie_(AUTH_PERNAH_KEY, '1', 400);
}
function clearAuthSession(){   // hanya dipanggil saat logout manual
  try{ localStorage.removeItem(AUTH_STORAGE_KEY); localStorage.removeItem(AUTH_PERNAH_KEY); }catch(e){}
  setCookie_(AUTH_STORAGE_KEY, '', 0);
  setCookie_(AUTH_PERNAH_KEY, '', 0);
}
function parseSession_(raw){
  try{
    const p = JSON.parse(raw);
    if(p && p.id && p.wa) return p;
  }catch(e){}
  return null;
}
function loadAuthSession(){
  let p = null;
  try{ p = parseSession_(localStorage.getItem(AUTH_STORAGE_KEY)); }catch(e){}
  if(!p){
    p = parseSession_(getCookie_(AUTH_STORAGE_KEY));
    if(p) saveAuthSession(p);   // pulihkan ke localStorage juga
  }
  return p;
}
function pernahLoginMember_(){
  try{ if(localStorage.getItem(AUTH_PERNAH_KEY)) return true; }catch(e){}
  return !!getCookie_(AUTH_PERNAH_KEY);
}

/* ---- Tebus Murah: syarat belanja (progress bar) -> pelanggan pilih produk tebus ---- */
let TEBUS = [];
const TEBUS_MIN_DEFAULT = 50000, TEBUS_MAX = 2; // TEBUS_MAX WAJIB sama dgn TEBUS_MURAH_ONLINE_MAX di server (Constants.js)
function mapTebus(t){
  return { id:String(t.produkId||t.ProdukId||t.id||''), nama:String(t.produkNama||''), harga:Number(t.hargaTebus)||0,
    asli:Number(t.produkHargaNormal)||0, min:Number(t.minBelanja)||TEBUS_MIN_DEFAULT,
    selesai: t.tanggalSelesai ? (new Date(t.tanggalSelesai).getTime()||0) : 0 };  // ms epoch, 0 = tidak diketahui
}
function belanjaBiasa(){ return cartLines().reduce((s,l)=>s+l.qty*hargaAkhir(l.produk),0); }
/* Jajanan & topping (seblak/bakaran/kopi/es teh/topping/...) TIDAK dihitung ke syarat Tebus Murah -
   cuma belanjaan retail biasa. belanjaBiasa() tetap total SEMUA item (dipakai total bayar);
   belanjaSyaratTebus() khusus untuk cek syarat minimal. WAJIB sama dgn server
   (PesananOnlineService._resolveItemsTebus -> KategoriService.isJajananNama). */
function isJajananLine(l){ const k = l.produk.kategori; return isJajananKategori(k) || isToppingKategori(k); }
function belanjaSyaratTebus(){ return cartLines().filter(l=>!isJajananLine(l)).reduce((s,l)=>s+l.qty*hargaAkhir(l.produk),0); }
function tebusMin(){ return TEBUS.length ? Math.min.apply(null, TEBUS.map(t=>t.min)) : TEBUS_MIN_DEFAULT; }
function tebusEligible(t){ return belanjaSyaratTebus() >= t.min; }
function tebusPicked(){ return TEBUS.filter(t=>state.tebus.includes(t.id) && tebusEligible(t)); }
function pruneTebus(){ state.tebus = state.tebus.filter(id=>{ const t=TEBUS.find(x=>x.id===id); return t && tebusEligible(t); }); }
function toggleTebus(id){
  const t = TEBUS.find(x=>x.id===id); if(!t) return;
  if(state.tebus.includes(id)) state.tebus = state.tebus.filter(x=>x!==id);
  else if(tebusEligible(t) && state.tebus.length<TEBUS_MAX) state.tebus.push(id);
  refresh();
}
function tebusImg(t){

function changeQty(id, delta){
  const p = PRODUCTS.find(p=>p.id===id);
  if(!p) return;
  const cur = state.cart[id]||0;
  state.cart[id] = Math.max(0, Math.min(p.stok, cur+delta));

  refresh();
}
/** Tambah 1 porsi Seblak + topping yang dicentang. Topping masuk keranjang sebagai produk
 *  biasa (harga & stok dicek server), pilihan per porsi dicatat di state.porsi. */
function addPorsi(id){
  const p = productById(id); if(!p || !punyaTopping(p)) return;
  const tops = pickedToppings();
  if((state.cart[p.id]||0) >= p.stok){ showToast('Stok '+p.nama+' tidak cukup'); return; }
  const kurang = tops.find(t=>(state.cart[t.id]||0) >= t.stok);
  if(kurang){ showToast('Stok topping '+kurang.nama+' tidak cukup'); return; }
  state.cart[p.id] = (state.cart[p.id]||0) + 1;
  tops.forEach(t=>{ state.cart[t.id] = (state.cart[t.id]||0) + 1; });
  state.porsi.push({ produkId:p.id, toppingIds:tops.map(t=>t.id) });
  state.toppingPick = [];
  pruneTebus();
  refresh();
  showToast('Ditambahkan ke keranjang');
}
function toggleTopping(id){
  id = String(id);
  state.toppingPick = state.toppingPick.includes(id) ? state.toppingPick.filter(x=>x!==id) : state.toppingPick.concat(id);
  if(state.detailId!=null) renderDetailDynamic();
}
/** Kelompokkan porsi Seblak di keranjang -> [{produkId, qty, toppings:[nama]}] untuk tampilan
 *  keranjang & Catatan pesanan. Dicocokkan dengan isi keranjang SEKARANG (customer bisa
 *  kurangi/hapus qty setelah pilih topping), jadi topping yang sudah tidak ada di keranjang
 *  tidak ikut ditulis. Seblak tanpa catatan porsi (mis. ditambah lewat tombol +) dianggap tanpa topping. */
function porsiGrup_(){
  const sisa = {};
  Object.keys(state.cart).forEach(id=>{ sisa[id] = state.cart[id]||0; });
  const grup = {}, urut = [];
  const tambah = (produkId, names)=>{
    const key = produkId+'|'+names.join(',');
    if(!grup[key]){ grup[key] = { produkId:produkId, qty:0, toppings:names }; urut.push(key); }
    grup[key].qty++;
  };
  state.porsi.forEach(po=>{
    if((sisa[po.produkId]||0) < 1) return;
    sisa[po.produkId]--;
    const names = [];
    po.toppingIds.forEach(tid=>{
      if((sisa[tid]||0) < 1) return;
      sisa[tid]--;
      const t = productById(tid); if(t) names.push(t.nama);
    });
    tambah(po.produkId, names);
  });
  Object.keys(sisa).forEach(id=>{
    if(!isSeblak(productById(id))) return;
    while(sisa[id] > 0){ sisa[id]--; tambah(id, []); }
  });
  return urut.map(k=>grup[k]);
}
/** Teks Catatan pesanan (terbaca kasir & kurir). Kosong kalau tidak ada seblak bertopping. */
function porsiCatatan_(){
  const g = porsiGrup_();
  if(!g.some(x=>x.toppings.length>0)) return '';
  return 'Topping seblak:\n' + g.map(x=>{
    const p = productById(x.produkId);
    return '- ' + x.qty + 'x ' + (p ? p.nama : 'Seblak') + ': ' + (x.toppings.length ? x.toppings.join(', ') : 'tanpa topping');
  }).join('\n');
}

function homeCountdownHtml(){
  const now = new Date();
  const [ch,cm] = STORE.jamTutup.split(':').map(Number);
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), ch, cm, 0);

  const p = n => String(n).padStart(2,'0');
  return '<b>'+p(Math.floor(left/3600))+'</b><i>:</i><b>'+p(Math.floor(left%3600/60))+'</b><i>:</i><b>'+p(left%60)+'</b>';

// Tanggal berakhir promo Tebus Murah paling cepat (ms epoch), 0 = tidak ada / server belum kirim.
function promoSelesaiMs(){
  const ends = TEBUS.map(t=>t.selesai).filter(x=>x>0);
  return ends.length ? Math.min.apply(null, ends) : 0;
}
function promoCountdownHtml(){
  const left = Math.max(0, Math.floor((promoSelesaiMs() - Date.now())/1000));
  const p = n => String(n).padStart(2,'0');
  return '<b>'+p(Math.floor(left/3600))+'</b>:<b>'+p(Math.floor(left%3600/60))+'</b>:<b>'+p(left%60)+'</b>';
}
setInterval(function(){
  const el = document.getElementById('pm-count');
  if(el) el.innerHTML = promoCountdownHtml();
}, 1000);

    +'<br><small>Server: …'+esc(BACKEND_URL.slice(-14))+'</small> <button class="link-btn" data-action="retry-tebus">Coba lagi</button></div></section>');
  if(diskon.length) parts.push(promoCatalogHtml(diskon));
  if(TEBUS.length) parts.push(promoEtalaseHtml());
  const adaIsi = diskon.length>0 || TEBUS.length>0;
  if(!adaIsi && !state.tebusError){
    parts.push(state.katalogLoading
      ? emptyState('boxEmpty','Memuat promo...','')
      : emptyState('ticket','Belum ada promo aktif saat ini. Pantau terus, ya!',''));
  }
  if(adaIsi) parts.push(promoFootHtml());
  return '<div class="pm">'+parts.join('')+'</div>';
}

function tabPesanan(){
  // Member: riwayat ambil dari server (tersimpan permanen per akun, lintas device).
  if(state.auth.status==='member'){
    if(state.riwayatLoading){
      return emptyState('boxEmpty','Memuat riwayat pesanan...','');
    }
    if(state.riwayatError){
      return `<div class="empty-state">${icon('boxEmpty')}<p>Gagal memuat riwayat: ${esc(state.riwayatError)}</p>
        <button class="btn-primary" data-action="retry-riwayat">Coba Lagi</button></div>`;
    }
    if(state.riwayatPelanggan.length===0){
      return emptyState('packageCheck','Belum ada pesanan sebagai member. Yuk mulai belanja!','Mulai Belanja','belanja');
    }
    return `<div class="section" style="padding-top:16px">
      <div class="riwayat-toolbar" style="padding:0 0 4px">
        <h2 class="font-chalk" style="font-size:24px;margin:0">Riwayat Pesanan</h2>
        <span style="font-size:11px;color:hsl(var(--ink-soft))">Sebagai ${esc(state.auth.pelanggan.nama)}</span>
      </div>
      <div class="retention-notice">Struk pesanan tersedia selama 60 hari sejak pesanan selesai.</div>
      ${state.riwayatPelanggan.map((o,idx)=>{
        // Boleh dibatalkan sendiri selagi Status server masih BARU - mencakup baik
        // "belum diproses toko" MAUPUN "masih menunggu pembayaran" (o.belumBayar),
        // karena StatusBayar pending TIDAK mengubah Status jadi DIPROSES (lihat
        // catatan PesananOnlineService.batalkanPesananPublik di server).
        const bisaBatal = o.statusMentah === 'BARU' && o.statusBayar !== 'PAID';
        return `
        <div class="order-card">
          <button class="order-card-open" data-action="open-receipt-member" data-order-index="${idx}">
            <div class="order-card-top">
              <span class="font-mono" style="font-weight:700;font-size:13px">${esc(o.nomor)}</span>
              <span class="order-status" data-belum-bayar="${o.belumBayar}">${esc(o.status)}</span>
            </div>
            <div class="order-meta">${esc(o.waktu)} · ${o.jumlahItem} item · ${o.metode==='ambil'?'Ambil di toko':'Diantar'}</div>

            <div class="order-total">${rupiah(o.total)}</div>
            ${o.belumBayar ? '<div class="order-meta" style="color:hsl(var(--red));font-weight:600;margin-top:4px">Ketuk untuk lanjutkan pembayaran</div>' : ''}
          </button>
          ${bisaBatal ? `<button class="btn-outline danger order-cancel-btn" data-action="batalkan-pesanan-member" data-order-index="${idx}">Batalkan Pesanan</button>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }

  // Tamu: riwayat cuma lokal (hilang kalau reload) - behavior lama, tanpa akun memang gak ada tempat nyimpennya.
  if(state.orders.length===0){
    return emptyState('packageCheck','Belum ada pesanan. Yuk mulai belanja kebutuhanmu!','Mulai Belanja','belanja') +
      `<div class="account-guest-note" style="text-align:center;padding:0 28px">Belanja sebagai <strong>Tamu</strong> - riwayat ini cuma tersimpan di perangkat ini. <button class="link-btn" data-action="open-auth">Masuk / daftar member</button> biar riwayat pesanan tersimpan otomatis.</div>`;
  }
  return `<div class="section" style="padding-top:16px">
    <h2 class="font-chalk" style="font-size:24px;margin:0 0 4px">Riwayat Pesanan (Tamu)</h2>
    <div class="account-guest-note" style="margin-bottom:12px">Cuma tersimpan di perangkat ini. <button class="link-btn" data-action="open-auth">Masuk / daftar member</button> biar tersimpan otomatis lintas perangkat.</div>
    <div class="retention-notice">Struk pesanan tersedia selama 60 hari sejak pesanan selesai.</div>
    ${state.orders.slice().reverse().map((o)=>{
      const idx = state.orders.indexOf(o);
      const belumBayar = orderBelumBayar(o.bayar, o.statusBayar);
      // Tamu: pesanan lokal ini TIDAK pernah ditarik ulang statusnya dari server setelah
      // dibuat (§ keterbatasan lama riwayat Tamu, di luar cakupan perubahan ini), jadi
      // TIDAK ada Status server buat dicek di sini seperti versi member di atas. Tombol
      // batal tetap ditampilkan (kecuali baru saja dibatalkan di perangkat ini) - server
      // (`batalkanPesananPublik`) yang jadi penentu akhir; kalau pesanan ternyata sudah
      // diproses toko, klik akan gagal dengan pesan jelas dari server.
      const bisaBatal = !o.dibatalkan && o.statusBayar !== 'PAID';
      return `
      <div class="order-card">
        <button class="order-card-open" data-action="open-receipt" data-order-index="${idx}">
          <div class="order-card-top">
            <span class="font-mono" style="font-weight:700;font-size:13px">${o.nomor}</span>
            <span class="order-status" data-belum-bayar="${belumBayar}">${esc(orderStatusLabel(o.status, o.bayar, o.statusBayar))}</span>
          </div>
          <div class="order-meta">${esc(o.waktu)} · ${o.jumlahItem} item · ${o.metode==='ambil'?'Ambil di toko':'Diantar'}</div>
          <div class="order-items">${o.items.map(it=>esc(it.qty+'x '+it.nama)).join(', ')}</div>
          <div class="order-total">${rupiah(o.total)}</div>
          ${belumBayar ? '<div class="order-meta" style="color:hsl(var(--red));font-weight:600;margin-top:4px">Ketuk untuk lanjutkan pembayaran</div>' : ''}
        </button>
        ${bisaBatal ? `<button class="btn-outline danger order-cancel-btn" data-action="batalkan-pesanan-tamu" data-order-index="${idx}">Batalkan Pesanan</button>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function openLegal(kind){
  const c = LEGAL_CONTENT[kind];
  if(!c) return;
  document.getElementById('legal-body').innerHTML = `
    <h2>${esc(c.title)}</h2>
    <div class="legal-text">${c.body()}</div>
    <div class="guest-link-row"><button class="link-btn" data-action="close-legal">Tutup</button></div>
  `;
  document.getElementById('legal-overlay').setAttribute('data-open','true');
  document.body.style.overflow='hidden';
}
function closeLegal(){
  document.getElementById('legal-overlay').setAttribute('data-open','false');
  document.body.style.overflow='';
}

function attachFaqListeners(){
  document.querySelectorAll('[data-action="toggle-faq"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = Number(btn.dataset.faq);
      state.faqOpen = state.faqOpen===i ? null : i;
      renderTabContent();
    });
  });
}
/** Input file "Ganti foto profil" di tab Akun - pilih gambar dari galeri HP, kompres, simpan per akun (lihat blok FOTO PROFIL). */
function attachFotoProfilListener(){
  document.querySelectorAll('[data-action-file="profil-foto"]').forEach(elm=>{
    elm.addEventListener('change', async e=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      if(!file.type.startsWith('image/')){ showToast('File harus berupa gambar.'); return; }
      try{
        const dataUrl = await compressImage(file, 400);
        simpanFotoProfilMember_(dataUrl);
        renderTabContent();
        showToast('Foto profil diperbarui.');
      }catch(err){
        showToast(err.message || 'Gagal memuat foto. Coba lagi.');
      }
    });
  });
}

    }).join('')}</div>

/* ---------- Tukar Poin di Keranjang (langsung mengurangi total bayar) ---------- */
function cartPoinHtml(){
  if(state.auth.status!=='member') return '';
  const head = '<h4>'+msym('monetization_on','fill')+'Tukar Poin';
  const note = t => '<div class="ct-card ct-poin">'+head+'</h4><div class="account-guest-note">'+t+'</div></div>';
  if(state.poinLoading && !state.poinMember) return note('Memuat saldo poin...');
  if(state.poinError && !state.poinMember) return note('Gagal memuat poin: '+esc(state.poinError)+' <button class="link-btn" data-action="retry-poin">Coba lagi</button>');
  if(!state.poinMember || !state.poinMember.terdaftar) return note('Nomor kamu belum terdaftar sebagai member poin toko, jadi belum bisa tukar Poin.');
  const saldo = state.poinMember.poin||0;
  if(saldo<=0) return note('Saldo Poin kamu masih 0.');
  return '<div class="ct-card ct-poin">'+head+'<small>Saldo '+saldo.toLocaleString('id-ID')+' Poin</small></h4>'
    + '<div class="poin-row"><input id="cart-inp-poin" type="number" inputmode="numeric" min="0" max="'+poinMaks()+'" step="1" placeholder="0" value="'+esc(state.form.poinDigunakan||'')+'"><button type="button" class="btn-outline" data-action="poin-pakai-semua">Pakai Semua</button></div>'
    + '<div class="account-guest-note" id="cart-poin-hint" style="margin-top:4px"></div></div>';
}
/* Update angka tanpa render ulang keranjang (biar fokus input tidak hilang saat mengetik). */
function updateCartPoinDisplay(){
  const sum = document.getElementById('ct-sum'); if(!sum) return;
  const d = estimasiPoinDiskon(), pts = poinTerpakai(), net = rupiah(netTotal());
  document.querySelectorAll('.js-cart-net').forEach(el=>{ el.textContent = net; });
  const row = document.getElementById('ct-poin-row');
  if(row){
    row.style.display = d>0 ? '' : 'none';
    document.getElementById('ct-poin-n').textContent = pts.toLocaleString('id-ID');
    document.getElementById('ct-poin-val').textContent = '-'+rupiah(d);
  }
  const h = (Number(sum.dataset.base)||0) + d;
  document.querySelectorAll('.js-cart-hemat').forEach(el=>{
    el.style.display = h>0 ? '' : 'none';
    el.textContent = 'Hemat '+rupiah(h)+(el.dataset.fmt==='bar' ? ' terpasang' : '');
  });
  const hint = document.getElementById('cart-poin-hint');
  if(hint){
    const maks = poinMaks().toLocaleString('id-ID');
    hint.textContent = pts>0 ? 'Potongan '+rupiah(d)+' dari '+pts.toLocaleString('id-ID')+' Poin. Maks. '+maks+' Poin untuk belanja ini.'
                            : 'Kosongkan kalau tidak mau pakai Poin. Maks. '+maks+' Poin untuk belanja ini.';
  }
}

      return `<div class="ct-item">
        <div class="ct-img"${pAttr(p.id)}>${img}${p.diskonPersen?'<i>-'+p.diskonPersen+'%</i>':''}</div>
        <div class="ct-info">
          <div${pAttr(p.id)}>
            ${p.satuan?'<span class="ct-pkg">per '+esc(p.satuan)+'</span>':''}
            <h5>${esc(p.nama)}</h5>
            ${(()=>{ const gs = pg.filter(x=>x.produkId===p.id); return gs.some(x=>x.toppings.length) ? '<div class="ct-top">'+gs.map(x=>esc(x.qty+'x '+(x.toppings.length?x.toppings.join(', '):'tanpa topping'))).join('<br>')+'</div>' : ''; })()}
            <div class="ct-pr"><b>${rupiah(hargaAkhir(p))}</b>${p.diskonPersen?'<s>'+rupiah(p.harga)+'</s>':''}</div>
          </div>
          <div class="ct-act">
            <button class="ct-del" data-action="qty" data-id="${p.id}" data-delta="-9999" aria-label="Hapus produk">${msym('delete')}</button>
            <div class="ct-step">${qb(p.id,-1,'remove')}<span>${l.qty}</span>${qb(p.id,1,'add',l.qty>=p.stok)}</div>
          </div>
        </div>
      </div>`;}).join('')}
    ${picked.map(t=>`<div class="ct-item">
        <div class="ct-img">${tebusImg(t)}<i class="gold">TEBUS</i></div>
        <div class="ct-info">
          <div>
            <span class="ct-pkg tb-tag">Tebus Murah ${rupiah(t.harga)}</span>
            <h5>${esc(t.nama)}</h5>
            <div class="ct-pr"><b>${rupiah(t.harga)}</b><s>${rupiah(t.asli)}</s><em>Hemat ${rupiah(Math.max(0,t.asli-t.harga))}</em></div>
          </div>
          <div class="ct-act">
            <button class="ct-del" data-action="tebus-toggle" data-id="${esc(t.id)}" aria-label="Batal tebus">${msym('delete')}</button>
            <span class="tb-max">Maks. 1 pcs</span>
          </div>
        </div>
      </div>`).join('')}
    ${tebusSectionHtml()}
    ${cartPoinHtml()}
    <div class="ct-card" id="ct-sum" data-base="${diskonProduk+hematTebusVal}">
      <h4>Ringkasan Pembayaran</h4>
      <div class="ct-row"><span>Subtotal Produk (${n} item)</span><b>${rupiah(asli)}</b></div>
      ${diskonProduk>0?'<div class="ct-row red"><span>'+msym('sell')+'Diskon Promo Produk</span><b>-'+rupiah(diskonProduk)+'</b></div>':''}
      ${hematTebusVal>0?'<div class="ct-row gold"><span>'+msym('redeem')+'Hemat Tebus Murah</span><b>-'+rupiah(hematTebusVal)+'</b></div>':''}
      <div class="ct-row red" id="ct-poin-row"${estimasiPoinDiskon()>0?'':' style="display:none"'}><span>${msym('monetization_on')}Tukar Poin (<span id="ct-poin-n">${poinTerpakai().toLocaleString('id-ID')}</span> Poin)</span><b id="ct-poin-val">-${rupiah(estimasiPoinDiskon())}</b></div>
      <div class="ct-total">
        <div><strong>Total Pembayaran</strong><p>Sudah termasuk diskon produk</p></div>
        <div class="r"><strong class="red js-cart-net">${rupiah(netTotal())}</strong><p class="blue js-cart-hemat" data-fmt="sum"${hemat>0?'':' style="display:none"'}>Hemat ${rupiah(hemat)}</p></div>

function setMethod(m){ state.method=m; renderCheckoutBody(); renderTabContent(); }

function qrisBox(){
  // BARU (integrasi QRIS ASLI via iPaymu) - QR dinamis cuma bisa dibuat SETELAH
  // pesanan tersimpan di server (referenceId ke iPaymu = Kode resmi pesanan, belum ada
  // sebelum submit). Jadi di dialog checkout ini cuma info, QR beneran muncul di struk
  // (openReceiptOrder) begitu pesanan berhasil dikirim.
  return `<div class="qris-box">
    <div class="qris-total js-net-total">${rupiah(netTotal())}</div>
    <div class="qris-note">Kode QR pembayaran (khusus buat pesanan ini) akan muncul di struk setelah kamu klik "Kirim Pesanan". Scan pakai aplikasi bank/e-wallet apa saja - pembayaran terverifikasi otomatis, tidak perlu kirim bukti manual.</div>
  </div>`;
}

// BARU (metode bayar Virtual Account via iPaymu) - daftar bank HARUS sinkron manual
// sama VA_BANKS (server, Constants.js) - server tetap validasi ulang kode bank yang
// dikirim, daftar di sini murni buat tampilan dropdown.
const VA_BANKS = { bca:'BCA', bni:'BNI', bri:'BRI', mandiri:'Mandiri', permata:'Permata' };
function setVaBank(bank){ state.vaBank = bank; renderCheckoutBody(); }

// BARU (fitur Tukar Poin checkout, mirror POSPage_RP_PER_POIN_REDEEM) - rasio TETAP
// di-hardcode di client, murni estimasi tampilan sebelum "Kirim Pesanan" - server
// (PesananOnlineService._resolvePoinRedeem) TETAP sumber kebenaran final, sama trade-off
// yang sudah diterima POS.
const RP_PER_POIN_REDEEM = 1;

/**
 * Potongan Rupiah estimasi dari input Tukar Poin checkout saat ini - 0 kalau bukan
 * member, belum terdaftar sebagai Member poin, atau Nomor WhatsApp yang diisi BELUM
 * sama persis dengan nomor member (lihat poinRedeemSection() - kondisi sama dipakai
 * buat tampil/sembunyikan input-nya).
 */
/* Nomor WA dibandingkan setelah dinormalisasi (08xx = 628xx) - dulu harus persis sama teksnya. */
function waKey(w){ let d = String(w||'').replace(/\D/g,''); if(d.startsWith('0')) d = '62'+d.slice(1); return d; }
/* ================================================================
   ALAMAT — Antar ke Rumah = alamat konsumen (member: tersimpan per akun di perangkat ini),
   Ambil di Toko = alamat toko. Satu sumber: state.form.alamat (dipakai juga di checkout).
   ================================================================ */
function alamatKey_(){ return 'ainiMartAlamat:'+state.auth.pelanggan.id; }
function muatAlamatMember_(){
  if(state.auth.status!=='member' || !state.auth.pelanggan) return '';
  try{ return localStorage.getItem(alamatKey_()) || ''; }catch(e){ return ''; }
}
function simpanAlamatMember_(v){
  if(state.auth.status!=='member' || !state.auth.pelanggan) return;
  try{ localStorage.setItem(alamatKey_(), String(v||'').trim()); }catch(e){}
}
/* ================================================================
   FOTO PROFIL — foto profil konsumen (member: tersimpan per akun di
   perangkat ini, sama seperti pola Alamat di atas). Dipilih dari galeri
   HP lewat <input type="file" accept="image/*">, dikompres di sisi
   klien (compressImage()) lalu disimpan sebagai data URL di localStorage.
   ================================================================ */
function fotoProfilKey_(){ return 'ainiMartFotoProfil:'+state.auth.pelanggan.id; }
function muatFotoProfilMember_(){
  if(state.auth.status!=='member' || !state.auth.pelanggan) return '';
  try{ return localStorage.getItem(fotoProfilKey_()) || ''; }catch(e){ return ''; }
}
function simpanFotoProfilMember_(dataUrl){
  if(state.auth.status!=='member' || !state.auth.pelanggan) return;
  try{
    if(dataUrl) localStorage.setItem(fotoProfilKey_(), dataUrl);
    else localStorage.removeItem(fotoProfilKey_());
  }catch(e){}
}
/** Avatar member + badge kamera buat ganti foto. hero=true dipakai di poin-hero (bg merah). */
function profileAvatarBadge_(hero){
  const foto = muatFotoProfilMember_();
  return '<div class="account-avatar avatar-upload'+(hero?' avatar-hero':'')+'">'
    + (foto ? '<img src="'+esc(foto)+'" alt="Foto profil">' : icon('user'))
    + '<label class="avatar-edit-btn" title="Ganti foto profil dari galeri">'+icon('camera')
    + '<input type="file" accept="image/*" data-action-file="profil-foto" style="display:none"></label>'
    + '</div>';
}
function homeAlamatHtml_(){
  if(state.method==='antar'){

    return '<div class="hm-addr"><span class="hm-addr-ic">'+msym('location_on','fill')+'</span><div class="hm-addr-txt"><small>'
      + (state.auth.status==='member' ? 'Diantar ke alamatmu' : 'Diantar ke') + '</small>'
      + (a ? '<b>'+esc(a)+'</b>' : '<span>Belum ada alamat pengantaran</span>')

  }

  return '<div class="hm-addr"><span class="hm-addr-ic">'+msym('storefront','fill')+'</span><div class="hm-addr-txt"><small>Ambil di toko</small><b>'+esc(STORE.nama)+'</b>'
    + '<span>'+esc(STORE.alamat)+'</span><span>Buka '+esc(STORE.jamBuka)+'–'+esc(STORE.jamTutup)+'</span></div>'
    + '<a class="hm-addr-btn" href="'+maps+'" target="_blank" rel="noopener">Rute</a></div>';
}
function openAlamat_(){
  const member = state.auth.status==='member';
  document.getElementById('alamat-body').innerHTML = `
    <h2>Alamat Pengantaran</h2>
    <div class="field"><label for="inp-alamat-edit">Alamat lengkap</label><textarea id="inp-alamat-edit" rows="3" placeholder="Jalan, nomor rumah, RT/RW, patokan">${esc(state.form.alamat||'')}</textarea></div>
    <div class="auth-hint">${member ? 'Tersimpan di perangkat ini dan otomatis terisi di pesananmu berikutnya.' : 'Berlaku untuk sesi ini saja. Masuk sebagai member supaya alamat tersimpan.'}</div>
    <button class="submit-btn" data-action="save-alamat">Simpan Alamat</button>

function closeAlamat_(){
  document.getElementById('alamat-overlay').setAttribute('data-open','false');
  document.body.style.overflow = '';
}
function saveAlamat_(){
  const t = document.getElementById('inp-alamat-edit');
  state.form.alamat = t ? t.value.trim() : '';

  closeAlamat_();

}

/** Nama & Nomor WhatsApp di form checkout: member login = terisi otomatis dari akun; Tamu / belum login = kosong. */
function isiIdentitasForm_(){
  const m = state.auth.status==='member' ? state.auth.pelanggan : null;
  state.form.nama = m ? String(m.nama||'') : '';
  state.form.wa = m ? String(m.wa||'') : '';
  if(m){ const a = muatAlamatMember_(); if(a) state.form.alamat = a; }   // member: pakai alamat tersimpan (kalau ada)
  else state.form.alamat = '';                                             // Tamu: kosong
}
function poinEligible(){
  return state.auth.status==='member' && !!state.poinMember && !!state.poinMember.terdaftar && (state.poinMember.poin||0) > 0;
}
/* Server cari member lewat `kontak`, jadi saat poin dipakai nomor di checkout harus = nomor member. */
function poinWaOk(){ const k = waKey(state.form.wa); return !!k && k === waKey(state.auth.pelanggan.wa); }
/* Maks. poin yang boleh dipakai: <= saldo dan tidak melebihi total belanja. */
function poinMaks(){
  const saldo = (state.poinMember && state.poinMember.poin) || 0;
  return Math.max(0, Math.min(saldo, Math.floor(cartTotal()/RP_PER_POIN_REDEEM)));
}
function poinTerpakai(){
  if(!poinEligible()) return 0;
  return Math.min(Math.max(0, Math.floor(Number(state.form.poinDigunakan)||0)), poinMaks());
}
function estimasiPoinDiskon(){ return Math.min(poinTerpakai()*RP_PER_POIN_REDEEM, cartTotal()); }
function netTotal(){ return Math.max(0, cartTotal() - estimasiPoinDiskon()); }

/**
 * Blok input Tukar Poin di dialog checkout - HANYA muncul buat member yang Nomor
 * WhatsApp-nya (diisi manual tiap checkout, lihat catatan submitOrder) SAMA PERSIS
 * dengan nomor akun member login (`state.auth.pelanggan.wa`) - poin selalu dicari
 * server pakai `kontak` yang diisi di form ini, bukan nomor akun login (lihat
 * PesananOnlineService._resolvePoinRedeem), jadi kalau beda nomor, redeem PASTI
 * ditolak server - tuntun customer isi nomor yang benar dulu daripada checkout gagal.
 */
function poinRedeemSection(){
  if(state.auth.status!=='member') return '';
  const pts = poinTerpakai(); if(pts<=0) return '';
  const note = t => '<div class="account-guest-note">'+t+'</div>';
  if(!poinWaOk()) return note('Kamu memakai <b>'+pts.toLocaleString('id-ID')+' Poin</b>. Isi Nomor WhatsApp sama dengan nomor member (<span class="font-mono">'+esc(state.auth.pelanggan.wa)+'</span>) supaya poin bisa dipakai. <button class="link-btn" data-action="poin-pakai-nomor">Pakai nomor member</button>');
  return note('Tukar Poin: <b>'+pts.toLocaleString('id-ID')+' Poin</b> (-'+rupiah(estimasiPoinDiskon())+') sudah dipotong dari total. Ubah di Keranjang.');
}

/** Re-render #poin-section apa adanya + pasang ulang listener input-nya (dipanggil
 * saat dialog checkout pertama dibuka DAN tiap kali Nomor WhatsApp berubah - lihat
 * listener 'wa' di renderCheckoutBody). SENGAJA method TERPISAH dari renderCheckoutBody
 * penuh - re-render dialog UTUH tiap ketik WA/Poin akan mencabut fokus input di tengah
 * mengetik (innerHTML diganti total), jadi cuma container kecil ini yang di-refresh. */
function renderPoinSection(){
  const el = document.getElementById('poin-section');
  if(!el) return;
  el.innerHTML = poinRedeemSection();
  const poinElm = document.getElementById('inp-poin');
  if(poinElm){
    poinElm.addEventListener('input', e=>{ state.form.poinDigunakan = e.target.value; updatePoinDisplay(); });
  }
  updatePoinDisplay();
}

/** Update Total ringkasan + hint potongan Poin TANPA re-render dialog (dipanggil tiap
 * ketik di #inp-poin) - pola sama alasan renderPoinSection() di atas, hindari fokus
 * input hilang. */
function updatePoinDisplay(){
  const net = rupiah(netTotal());
  document.querySelectorAll('#checkout-total-val,.js-net-total').forEach(el=>{ el.textContent = net; });
  const hintEl = document.getElementById('poin-hint');
  if(hintEl){
    const dipakai = poinTerpakai(), maks = poinMaks().toLocaleString('id-ID');
    hintEl.textContent = dipakai>0
      ? 'Potongan estimasi: '+rupiah(estimasiPoinDiskon())+' (dari '+dipakai.toLocaleString('id-ID')+' Poin). Maks. '+maks+' Poin untuk belanja ini.'
      : 'Kosongkan kalau tidak mau pakai Poin. Maks. '+maks+' Poin untuk belanja ini.';
  }
}
function vaBox(){
  return `<div class="qris-box">
    <div class="qris-note" style="margin-bottom:8px">Pilih bank tujuan transfer Virtual Account:</div>
    <div class="method-toggle" style="flex-wrap:wrap">
      ${Object.keys(VA_BANKS).map(b=>`<button class="method-btn" data-action="set-va-bank" data-bank="${b}" data-active="${state.vaBank===b}">${VA_BANKS[b]}</button>`).join('')}
    </div>

async function submitOrder(){
  const lines = cartLines();
  if(lines.length===0 || state.submitting) return;

  state.submitting = true;
  const btn = document.getElementById('submit-order-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Mengirim...'; }
  hideCheckoutError();
  const poinPakai = poinTerpakai();

  try{
    // Lokasi otomatis ikut pesanan (masuk Catatan -> terbaca kasir & kurir). Gagal/ditolak = pesanan tetap dikirim.
    // FIX (lama banget pas Kirim Pesanan): dulu getLokasi_() BARU dipanggil di sini,
    // SETELAH klik Kirim Pesanan - GPS (`enableHighAccuracy`) bisa makan sampai 8 detik
    // sendiri, DIJUMLAH ke waktu request server (bukan bareng), jadi "Mengirim..."
    // nyangkut lama padahal server-nya sendiri belum tentu lambat. Sekarang `getLokasi_()`
    // sudah dimulai lebih awal lewat prefetchLokasi_() (saat checkout dibuka/metode
    // Diantar/checkbox dicentang) - di sini tinggal `await` Promise yang biasanya SUDAH
    // selesai duluan sambil customer isi Nama/WhatsApp/Alamat. `|| getLokasi_()` cuma
    // jaring pengaman kalau prefetch entah kenapa belum sempat jalan sama sekali.
    let lokasi = null;
    if(state.method==='antar' && state.shareLokasi){
      if(btn) btn.textContent = 'Mengambil lokasi...';
      lokasi = await (state.lokasiPrefetch || getLokasi_());
      if(btn) btn.textContent = 'Mengirim...';
    }
    const saved = await api('apiBuatPesananOnlinePublik', {
      pelanggan: state.form.nama.trim(),
      kontak: poinPakai>0 ? state.auth.pelanggan.wa : state.form.wa.trim(),  // server cari member lewat `kontak` -> pakai format nomor member persis saat tukar poin
      tipe: state.method==='antar' ? 'Delivery' : 'Pickup',
      alamat: state.method==='antar' ? state.form.alamat.trim() : '',
      items: lines.map(l=>({ produkId: l.produk.id, qty: l.qty })).concat(tebusPicked().map(t=>({ produkId: t.id, qty: 1, tebus: true }))),  // harga tebus dihitung ulang server (PesananOnlineService._resolveItemsTebus)
      catatan: [state.form.catatan.trim(), porsiCatatan_(), lokasi ? lokasiLine_(lokasi) : ''].filter(Boolean).join('\n'),
      // Kalau lagi masuk sebagai member, pesanan dipasang ke akun ini biar
      // muncul di Riwayat Pesanan server. Tamu = null (behavior lama).
      pelangganId: state.auth.status==='member' ? state.auth.pelanggan.id : null,
      metodeBayar: state.payment==='qris' ? 'QRIS' : (state.payment==='va' ? 'VA' : 'COD'),
      vaBank: state.payment==='va' ? state.vaBank : undefined,
      // Fitur Tukar Poin (BARU) - server tetap validasi ulang saldo & resolve Member
      // dari `kontak` di atas (lihat PesananOnlineService._resolvePoinRedeem), angka di
      // sini murni permintaan customer. 0 kalau bukan member/tidak diisi (jalur biasa).
      poinDigunakan: poinPakai
    });
    // `saved` datang dari PesananOnlineModel.toClientObject (server) - dipakai
    // apa adanya buat struk (Kode resmi, Items sudah dihitung ulang server,
    // Total server jadi sumber kebenaran, BUKAN cartTotal() sisi client).
    const order = {
      nomor: saved.Kode,
      nama: saved.Pelanggan || state.form.nama.trim(),
      wa: saved.Kontak || state.form.wa.trim(),
      alamat: saved.Alamat || '',
      catatan: saved.Catatan || '',
      metode: state.method,
      bayar: saved.MetodeBayar || (state.payment==='qris' ? 'QRIS' : (state.payment==='va' ? 'VA' : 'COD')),
      items: (saved.Items || []).map(it=>({ nama: it.nama, qty: it.qty, harga: it.harga })),
      jumlahItem: (saved.Items || []).reduce((s,it)=>s+it.qty,0),
      total: saved.Total != null ? saved.Total : cartTotal(),
      waktu: new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}),
      // Timestamp mentah (bukan string terformat `waktu` di atas) - dipakai hitung
      // countdown 24 jam QRIS/VA di openReceiptOrder (mulai sejak pesanan diklik/dibuat,
      // BUKAN sejak struk dibuka - biar konsisten walau struk ditutup lalu dibuka lagi).
      createdAtMs: saved.CreatedAt ? new Date(saved.CreatedAt).getTime() : Date.now(),
      // BARU (integrasi QRIS ASLI via iPaymu) - kosong semua kalau bayar==='COD',
      // atau kalau chargeQris sempat gagal di server (StatusBayar tetap '' - lihat
      // fallback try/catch PesananOnlineService.buatPesananPublik). `qrisQrString` =
      // payload EMV mentah, DIRENDER JADI GAMBAR DI BROWSER (lib qrcode.js, lihat
      // openReceiptOrder) - iPaymu TIDAK sediakan gambar QR siap pakai seperti Midtrans dulu.
      qrisQrString: saved.QrisQrString || '',
      qrisExpiredAt: saved.QrisExpiredAt || '',
      // BARU (metode bayar Virtual Account via iPaymu) - kosong semua kalau
      // bayar!=='VA', atau kalau chargeVa sempat gagal di server (pola sama fallback
      // qrisQrString di atas). `vaBank` dipakai frontend nampilin nama bank di struk.
      vaBank: saved.VaBank || '',
      vaNumber: saved.VaNumber || '',
      vaExpiredAt: saved.VaExpiredAt || '',
      statusBayar: saved.StatusBayar || '',
      statusMentah: saved.Status || 'BARU',
      diskonPoin: saved.DiskonPoin || 0,
      petugasNama: saved.PetugasNama || ''
    };
    state.orders.push(order);
    saveGuestOrders();
    state.cart = {};
    state.porsi = [];
    state.tebus = [];
    // Member: cuma Nama yang keisi otomatis buat checkout berikutnya, No WhatsApp
    // sengaja dikosongin (isi manual tiap kali) - lihat catatan di loginSuccess().
    // Tamu: dikosongin kayak semula.
    if(order.metode==='antar') simpanAlamatMember_(order.alamat);   // alamat terakhir jadi default pesanan berikutnya (member)
    state.form = { nama:'', wa:'', alamat:'', catatan:'', poinDigunakan:'' };
    isiIdentitasForm_();
    if(order.metode==='antar' && state.auth.status!=='member') state.form.alamat = order.alamat;   // Tamu: ingat di sesi ini
    state.method = 'ambil';
    state.payment = 'cod';
    state.vaBank = '';
    state.lokasiPrefetch = null;   // reset - checkout berikutnya ambil lokasi baru, bukan bekas pesanan ini
    state.submitting = false;
    closeCheckout();
    refresh();
    // refresh stok terbaru dari server (stok belum dipotong, tapi produk lain
    // bisa saja berubah sementara customer checkout) - non-blocking, struk
    // tetap tampil langsung pakai data `saved` di atas.
    loadKatalog();
    if(state.auth.status==='member'){
      loadRiwayatPelanggan(); // update riwayat server, non-blocking
      // Fitur Tukar Poin (BARU) - saldo di kartu "Poin Member" tab Akun bisa saja
      // berkurang dari checkout barusan, refresh biar tidak nampilin angka basi.
      loadPoinMember();
    }
    openReceiptOrder(order);
  }catch(e){
    state.submitting = false;
    showCheckoutError(e.message || 'Gagal mengirim pesanan. Coba lagi.');
    if(btn){ btn.disabled = false; btn.textContent = 'Kirim Pesanan'; }
  }
}

function showCheckoutError(msg){
  const body = document.getElementById('checkout-body');
  if(!body) return;
  let el = document.getElementById('checkout-error');
  if(!el){
    el = document.createElement('div');
    el.id = 'checkout-error';
    el.style.cssText = 'color:hsl(var(--red));font-size:12.5px;margin-top:10px;text-align:center';
    body.appendChild(el);
  }
  el.textContent = msg;
}
function hideCheckoutError(){
  const el = document.getElementById('checkout-error');
  if(el) el.remove();
}

function setAuthMode(mode){ state.authMode = mode; state.authError = null; renderAuthBody(); }

function renderAuthBody(){

  if(!body) return;
  const f = state.authForm;
  const isDaftar = state.authMode==='daftar';
  body.innerHTML = `
    <h2>${isDaftar ? 'Daftar Member Baru' : 'Masuk Member'}</h2>
    <div class="auth-tabs">
      <button class="auth-tab" data-action="set-auth-mode" data-mode="login" data-active="${!isDaftar}">Masuk</button>

    </div>
    <div class="auth-hint">${isDaftar ? 'Nomor kamu belum terdaftar sebagai member. Lengkapi nama buat daftar sekaligus masuk.' : 'Masuk pakai nomor WhatsApp & PIN member kamu. Belum punya akun? Pindah ke tab "Daftar Baru", nanti otomatis kedeteksi juga kalau nomornya belum member.'}</div>
    ${state.authError ? '<div class="auth-error">'+esc(state.authError)+'</div>' : ''}
    ${isDaftar ? '<div class="field"><label for="auth-nama">Nama</label><input id="auth-nama" type="text" placeholder="Nama kamu" value="'+esc(f.nama)+'"></div>' : ''}
    <div class="field"><label for="auth-wa">Nomor WhatsApp</label><input id="auth-wa" type="tel" placeholder="08xx-xxxx-xxxx" value="${esc(f.wa)}"></div>
    ${isDaftar ? '<div class="field"><label for="auth-alamat">Alamat Pengantaran (opsional)</label><textarea id="auth-alamat" rows="2" placeholder="Jalan, nomor rumah, RT/RW, patokan">'+esc(f.alamat)+'</textarea></div>' : ''}
    <div class="field"><label for="auth-pin">PIN (4-6 digit)</label><input id="auth-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" value="${esc(f.pin)}"></div>
    <button class="submit-btn" id="auth-submit-btn" data-action="submit-auth" ${state.authSubmitting?'disabled':''}>${state.authSubmitting ? 'Memproses...' : (isDaftar ? 'Daftar & Masuk' : 'Masuk')}</button>
    <div class="guest-link-row">atau <button class="link-btn" data-action="close-auth">Masuk sebagai Tamu</button></div>
  `;
  ['nama','wa','alamat','pin'].forEach(key=>{
    const elm = document.getElementById('auth-'+key);
    if(!elm) return;
    elm.addEventListener('input', e=>{ state.authForm[key]=e.target.value; });
  });
}

async function submitAuth(){
  if(state.authSubmitting) return;
  const f = state.authForm;
  const wa = f.wa.trim();
  const pin = f.pin.trim();
  if(!wa || !pin){ state.authError='Nomor WhatsApp & PIN wajib diisi.'; renderAuthBody(); return; }
  if(!/^[0-9]{4,6}$/.test(pin)){ state.authError='PIN harus 4-6 digit angka.'; renderAuthBody(); return; }

  state.authSubmitting = true;
  state.authError = null;
  renderAuthBody();

  try{
    if(state.authMode==='daftar'){
      const nama = f.nama.trim();
      if(!nama) throw new Error('Nama wajib diisi.');
      const data = await api('apiDaftarPelangganPublik', { nama, wa, pin });
      // Alamat yang diisi saat daftar (atau yang sudah diketik sebagai Tamu) jadi alamat pengantaran member
      // dan langsung tampil di beranda mode "Antar ke Rumah".
      const alamat = (f.alamat || state.form.alamat || '').trim();
      if(alamat && data && data.id){
        try{ localStorage.setItem('ainiMartAlamat:'+data.id, alamat); }catch(e){}
        state.method = 'antar';
      }
      loginSuccess(data);
    } else {
      const data = await api('apiLoginPelangganPublik', { wa, pin });
      if(!data.terdaftar){
        // Nomor belum jadi member -> otomatis pindah ke form daftar (PIN & WA dibawa).
        state.authMode = 'daftar';
        state.authError = 'Nomor belum terdaftar sebagai member. Lengkapi nama buat daftar.';
        state.authSubmitting = false;
        renderAuthBody();
        return;
      }
      if(!data.valid) throw new Error('PIN salah. Coba lagi.');
      loginSuccess(data.pelanggan);
    }
  }catch(e){
    state.authSubmitting = false;
    state.authError = e.message || 'Gagal memproses. Coba lagi.';
    renderAuthBody();
  }
}

function loginSuccess(pelanggan){
  state.auth = { status:'member', pelanggan: pelanggan };
  saveAuthSession(pelanggan);
  state.authSubmitting = false;
  closeAuth();
  // Nama & No WhatsApp checkout otomatis terisi dari akun member.
  isiIdentitasForm_();
  loadRiwayatPelanggan();
  loadPoinMember();
  refresh();
}

function logout(){
  state.auth = { status:'guest', pelanggan:null };
  clearAuthSession();
  isiIdentitasForm_();   // Tamu = Nama & WhatsApp kosong
  state.riwayatPelanggan = [];
  state.riwayatError = null;
  state.poinMember = null;
  state.poinError = null;
  refresh();
}

/* Cuma innerHTML #admin-produk-list yang diganti tiap ketik di kotak cari, BUKAN
   seluruh body - supaya fokus & posisi kursor di kotak cari gak ke-reset tiap huruf. */
function renderAdminProdukList(){
  const listElm = document.getElementById('admin-produk-list');
  if(!listElm) return;
  const q = (state.adminProdukQuery||'').trim().toLowerCase();
  const list = q ? PRODUCTS.filter(p=>String(p.nama||'').toLowerCase().includes(q)) : PRODUCTS;
  const LIMIT = 40; // batasi render awal biar ringan kalau katalog ratusan item
  const shown = list.slice(0, LIMIT);
  listElm.innerHTML = !PRODUCTS.length
    ? '<div class="admin-note">Katalog belum termuat. Tutup dialog ini, tunggu katalog kebuka, lalu coba lagi.</div>'
    : (shown.length ? shown.map(adminProdukRow).join('') : '<div class="admin-note">Produk tidak ditemukan.</div>')
      + (list.length>LIMIT ? '<div class="admin-note">Menampilkan '+LIMIT+' dari '+list.length+' produk. Persempit pencarian buat lihat lainnya.</div>' : '');
  listElm.querySelectorAll('[data-produk-photo]').forEach(el=>{
    el.addEventListener('change', e=>{
      const file = e.target.files && e.target.files[0];
      const id = el.dataset.produkPhoto;
      if(file) uploadFotoProduk(id, file);
    });
  });
}
function adminProdukRow(p){
  const busy = !!state.adminProdukBusy[p.id];
  const err = state.adminProdukRowError[p.id];
  return `
    <div class="admin-produk-row">
      <div class="admin-produk-thumb">${p.gambar ? '<img src="'+esc(p.gambar)+'" alt="">' : '<span aria-hidden="true">'+(p.emoji||'🛒')+'</span>'}</div>

/**
 * Upload foto satu produk lewat action 'updateFotoProduk'. Backend-nya sudah ditambahkan
 * ke project Apps Script ASLI (dicek langsung dari file yang kamu upload, bukan tebakan lagi):
 *   - src/server/controllers/ProdukController.js -> fungsi apiUpdateFotoProdukPublik()
 *   - src/server/Code.js -> whitelist doPost, key 'updateFotoProduk'
 * Foto disimpan APA ADANYA sebagai data URL langsung di kolom Foto Sheet_Produk (BUKAN
 * upload ke Drive) - pola ini SAMA PERSIS seperti Logo Toko/Icon Jajanan yang sudah ada
 * (STORE_LOGO_DATA_URL dsb, lihat PengaturanTokoPublikController.js), makanya di sini
 * dipaksa muat di bawah ~45.000 karakter (getTrimmedImage(compressed, 45000) di bawah) -
 * batas aman 1 cell Google Sheets (~50.000 karakter).
 */
async function uploadFotoProduk(produkId, file){
  const p = PRODUCTS.find(x=>String(x.id)===String(produkId));
  if(!p) return;
  if(!file.type.startsWith('image/')){
    state.adminProdukRowError[produkId] = 'File harus berupa gambar.';
    renderAdminProdukList();
    return;
  }
  state.adminProdukBusy[produkId] = true;
  delete state.adminProdukRowError[produkId];
  renderAdminProdukList();
  try{
    const compressed = await compressImage(file, 720);   // resize + kompres ke JPEG, sama seperti logo/promo
    const rapi = await getTrimmedImage(compressed, 45000); // buang tepi putih/transparan + pastikan muat 1 cell Sheets (aman dari CORS: sumbernya data URL sendiri)
    const saved = await api('updateFotoProduk', { pin: state.adminForm.pin, produkId: produkId, foto: rapi });
    p.gambar = (saved && saved.foto) || rapi; // optimistic: kalau server gak balikin URL, pakai hasil kompres sendiri dulu
    showToast('Foto "'+p.nama+'" tersimpan.');
    renderTabContent(); // grid Beranda/Belanja & halaman detail ikut kebarui seketika
  }catch(e){
    state.adminProdukRowError[produkId] = e.message || 'Gagal menyimpan foto. Coba lagi.';
  }finally{
    state.adminProdukBusy[produkId] = false;
    renderAdminProdukList();
  }
}

async function submitAdminSave(){
  const nama = state.adminForm.nama.trim();
  const whatsapp = state.adminForm.whatsapp.trim().replace(/[\s\-+]/g,'');
  const alamat = state.adminForm.alamat.trim();
  if(!nama){ state.adminError='Nama toko wajib diisi.'; renderAdminBody(); return; }
  if(!/^62[0-9]{8,13}$/.test(whatsapp)){ state.adminError='Nomor WhatsApp harus diawali 62 dan hanya angka (contoh: 6281234567890).'; renderAdminBody(); return; }
  if(!alamat){ state.adminError='Alamat toko wajib diisi.'; renderAdminBody(); return; }
  const promos = (state.adminForm.promos||[]).map(x=>({ judul:x.judul.trim(), sub:x.sub.trim(), periode:x.periode.trim(), gambar:x.gambar||'' }));
  if(promos.some(x=>!x.judul && !x.gambar)){ state.adminError='Tiap banner butuh judul atau gambar (atau hapus banner yang kosong).'; renderAdminBody(); return; }
  const jajananIcons = {};
  JAJANAN_ITEMS.forEach(it=>{ if(state.adminForm.jajananIcons && state.adminForm.jajananIcons[it.key]) jajananIcons[it.key] = state.adminForm.jajananIcons[it.key]; });

  state.adminSaving = true;
  state.adminError = null;
  renderAdminBody();
  try{
    // BARU: simpan ke server (bukan localStorage) - PIN dikirim ulang di sini
    // biar server yang jadi penentu akhir boleh/gaknya perubahan tersimpan
    // (lihat catatan ADMIN_PIN di atas + fungsi updatePengaturanToko di Apps Script).
    // "jajananIcons" disimpan server per-item ke 4 cell Sheet_Config terpisah (lihat
    // JAJANAN_ICON_CONFIG_KEYS_ di PengaturanTokoPublikController.js) - jadi sama kayak
    // Nama/Logo/dll di atas, langsung berlaku di semua device begitu tersimpan.
    const saved = await api('updatePengaturanToko', {
      pin: state.adminForm.pin,
      nama, whatsapp, alamat,
      logo: state.adminForm.logo || '',
      promo: JSON.stringify(promos),
      jajananIcons: JSON.stringify(jajananIcons)
    });
    STORE.nama = saved.nama || nama;
    STORE.whatsapp = saved.whatsapp || whatsapp;
    STORE.alamat = saved.alamat || alamat;
    STORE.logo = saved.logo || '';
    const serverPromo = !!saved && saved.promo !== undefined; // server lama (belum update Apps Script) tidak mengembalikan field promo
    const promoChanged = JSON.stringify(promos) !== JSON.stringify(PROMOS);
    setPromos(promos); savePromosLocal(promos);
    // Pakai balikan server kalau ada (itu yang beneran tersimpan & divalidasi ulang server-side) -
    // fallback ke objek lokal cuma buat server lama yang belum kirim field ini balik.
    const savedJajananIcons = (saved && saved.jajananIcons && typeof saved.jajananIcons==='object') ? saved.jajananIcons : jajananIcons;
    JAJANAN_ICONS = savedJajananIcons; saveJajananIconsLocal(savedJajananIcons);
    state.adminSaving = false;
    closeAdmin();
    applyStoreBranding(); // update header dsb di device INI juga, tanpa nunggu reload
    if(state.tab==='beranda') renderTabContent(); // icon jajanan baru langsung kelihatan tanpa reload
    showToast((!serverPromo && (promos.length || promoChanged))
      ? 'Tersimpan. Promo banner baru berlaku di perangkat ini saja (server belum mendukung).'
      : 'Pengaturan toko disimpan & langsung berlaku di semua perangkat.');
  }catch(e){
    state.adminSaving = false;
    state.adminError = e.message || 'Gagal menyimpan ke server. Coba lagi.';
    renderAdminBody();
  }
}

const PROMOS_KEY = 'ainiMartPromos';
const PROMO_MAX = 5;
function normPromos(raw){
  let a = raw;
  if(typeof a==='string'){ try{ a = JSON.parse(a); }catch(e){ a = []; } }
  return (Array.isArray(a) ? a : []).map(x=>({
    judul: String(x && x.judul || '').trim().slice(0,40),
    sub: String(x && x.sub || '').trim().slice(0,80),
    periode: String(x && x.periode || '').trim().slice(0,24),
    gambar: /^(data:image\/|https?:\/\/)/.test(String(x && x.gambar || '')) ? String(x.gambar) : ''
  })).filter(x=>x.judul || x.gambar).slice(0, PROMO_MAX);
}
function setPromos(arr){ PROMOS.splice(0, PROMOS.length, ...arr); state.promoIdx = 0; }
function savePromosLocal(arr){ try{ localStorage.setItem(PROMOS_KEY, JSON.stringify(arr)); }catch(e){} }
function compressImage(file, maxW, maxLen){
  maxLen = maxLen || 60000;
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error('Gagal membaca gambar.'));
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>rej(new Error('Gambar tidak bisa dibuka. Coba gambar lain.'));
      im.onload = ()=>{
        const sc = Math.min(1, maxW/im.width), w = Math.round(im.width*sc), h = Math.round(im.height*sc);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
        let q = .8, out = c.toDataURL('image/jpeg', q);
        while(out.length > maxLen && q > .4){ q -= .1; out = c.toDataURL('image/jpeg', q); }
        res(out);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const PESANAN_STATUS_LABEL = {

/**
 * QRIS/VA yang belum terverifikasi (StatusBayar masih 'PENDING') tampilkan "Menunggu
 * Pembayaran" (bukan "Menunggu konfirmasi") - toko belum bisa proses sebelum bayar
 * masuk, dan kartu ini yang diklik customer buat lanjut bayar (lihat tabPesanan()).
 * @param {string} status kode PESANAN_ONLINE_STATUS mentah dari server

 * @param {string} statusBayar 'PENDING' | 'PAID' | 'EXPIRED' | 'FAILED' | ''
 * @return {string}
 */
function orderStatusLabel(status, bayar, statusBayar){
  if((bayar==='QRIS' || bayar==='VA') && statusBayar==='PENDING') return 'Menunggu Pembayaran';
  return PESANAN_STATUS_LABEL[status] || status || 'Menunggu konfirmasi';
}

  return (bayar==='QRIS' || bayar==='VA') && statusBayar==='PENDING';
}

/** Barcode Code128-B (SVG, tanpa library) dari teks `txt`. */
function code128Svg_(txt){
  const vals = [104];
  for(const ch of String(txt)){ const c = ch.charCodeAt(0); vals.push(c>=32 && c<=126 ? c-32 : 0); }
  let sum = 104;
  for(let i=1;i<vals.length;i++) sum += vals[i]*i;
  vals.push(sum%103, 106);
  let x = 10, bars = '';
  vals.forEach(v=>{
    const p = C128[v];
    for(let i=0;i<p.length;i++){ const w = +p[i]; if(i%2===0) bars += '<rect x="'+x+'" y="0" width="'+w+'" height="60"/>'; x += w; }
  });
  return '<svg viewBox="0 0 '+(x+10)+' 60" preserveAspectRatio="none" role="img" aria-label="Barcode '+esc(txt)+'"><rect x="0" y="0" width="'+(x+10)+'" height="60" fill="#fff"/><g fill="#000">'+bars+'</g></svg>';
}

const LOK_RE = /https:\/\/www\.google\.com\/maps\?q=-?\d+\.\d+,-?\d+\.\d+/;
function getLokasi_(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy) }),
      ()=>res(null),
      { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
  });
}

/** Polling status pesanan + pembayaran tiap 8 dtk selagi halaman terbuka. Gagal = badge "Tersimpan Lokal". */
function setTrkSync_(ok){
  const el = document.getElementById('trk-sync'); if(!el) return;
  el.setAttribute('data-ok', ok ? 'true' : 'false');
  el.textContent = ok ? 'Terhubung ke Server Kasir' : 'Pesanan Tersimpan Lokal (Menunggu Koneksi ke Server Kasir)';
}
async function trkPoll_(o){
  if(state.receiptOrder !== o) return;
  if(navigator.onLine === false){ setTrkSync_(false); return; }
  let r;
  try{ r = await api('apiCekStatusPembayaranPesanan', { kode: o.nomor }); }
  catch(e){ setTrkSync_(false); return; }
  if(state.receiptOrder !== o) return;
  setTrkSync_(true);
  const stBaru = String(r.status || '').trim().toUpperCase(), bayarBaru = r.statusBayar || '';
  const berubah = stBaru !== trkStatus_(o) || (r.petugasNama||'') !== (o.petugasNama||'') && r.petugasNama;
  const bayarBerubah = bayarBaru !== (o.statusBayar||'');
  if(stBaru) o.statusMentah = stBaru;
  if(r.petugasNama) o.petugasNama = r.petugasNama;
  o.statusBayar = bayarBaru;
  if(berubah){ const l = document.getElementById('trk-live'); if(l) l.innerHTML = trkLiveHtml_(o); }
  if(bayarBerubah || berubah){ const b = document.getElementById('trk-bayar'); if(b) b.textContent = trkBayarLabel_(o); }
  const badge = document.getElementById('qris-status-badge');
  if(badge){
    if(bayarBaru==='PAID'){ badge.textContent = 'Pembayaran diterima ✓'; badge.style.color = 'hsl(var(--green))'; }
    else if(bayarBaru==='EXPIRED'){ badge.textContent = 'Kedaluwarsa - hubungi toko lewat WhatsApp.'; badge.style.color = 'hsl(var(--red))'; }
    else if(bayarBaru==='FAILED'){ badge.textContent = 'Pembayaran gagal - hubungi toko lewat WhatsApp.'; badge.style.color = 'hsl(var(--red))'; }
  }
  state.orders = state.orders.map(x => x.nomor===o.nomor ? Object.assign(x, { statusMentah:o.statusMentah, statusBayar:o.statusBayar, petugasNama:o.petugasNama||'' }) : x);
  saveGuestOrders();
  if(stBaru==='SELESAI' || stBaru==='DIBATALKAN') stopTrackPolling_();
}
function startTrackPolling_(o){
  stopTrackPolling_();
  trkPoll_(o);
  state.trkInterval = setInterval(()=>trkPoll_(o), 8000);
}
function stopTrackPolling_(){ if(state.trkInterval){ clearInterval(state.trkInterval); state.trkInterval = null; } }
window.addEventListener('online', ()=>{ if(state.receiptOrder) startTrackPolling_(state.receiptOrder); });
window.addEventListener('offline', ()=>setTrkSync_(false));

/**

 * mentah (`qrisQrString`), BUKAN gambar QR siap pakai kayak Midtrans dulu (`qrisQrUrl`

 * (davidshimjs/qrcodejs, di-load lewat CDN di <head>) langsung ke div#qris-canvas.
 * @param {string} qrString payload EMV mentah dari server (saved.QrisQrString)
 */
function renderQrisCanvas_(qrString){
  const el = document.getElementById('qris-canvas');
  if(!el || !qrString || typeof QRCode==='undefined') return;
  el.innerHTML = '';
  new QRCode(el, { text: qrString, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
}

/**
 * Unduh gambar QR yang lagi ditampilkan (div#qris-canvas) sebagai file PNG. lib
 * qrcode.js (davidshimjs) merender <canvas> - convert langsung ke data URL lewat
 * toCanvas.toDataURL, tidak perlu fetch/panggil server lagi. Fallback ke <img> kalau
 * browser lama dapat elemen img bukan canvas (perilaku lib ini di beberapa browser).
 * @param {string} nomor kode pesanan, dipakai sebagai nama file
 */
function downloadQrisImage_(nomor){
  const container = document.getElementById('qris-canvas');
  const canvas = container && container.querySelector('canvas');
  const img = container && container.querySelector('img');
  const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
  if(!dataUrl){ showToast('QR belum siap, coba lagi sebentar.'); return; }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'QRIS-' + (nomor || 'pesanan') + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/**
 * BARU (integrasi QRIS ASLI via iPaymu) - polling ringan tiap 5 detik selagi struk
 * QRIS masih terbuka, baca kolom StatusBayar terbaru (diperbarui webhook iPaymu di
 * server - lihat PesananOnlineService.cekStatusBayar). Berhenti otomatis kalau status
 * sudah final (PAID/EXPIRED/FAILED) atau struk ditutup (closeReceipt di bawah).
 * @param {string} kode Kode pesanan (order.nomor)
 */
function startPaymentPolling(kode){
  stopPaymentPolling();
  state.paymentPollInterval = setInterval(async () => {
    let result;
    try { result = await api('apiCekStatusPembayaranPesanan', { kode }); }
    catch(e){ return; } // gagal 1x polling - diamkan, coba lagi polling berikutnya
    const badge = document.getElementById('qris-status-badge');
    if(!badge) { stopPaymentPolling(); return; } // struk sudah ditutup/beda pesanan

    if(result.statusBayar === 'PAID'){
      badge.textContent = 'Pembayaran diterima ✓';
      badge.style.color = 'hsl(var(--green,#16a34a))';
      stopPaymentPolling();
    } else if(result.statusBayar === 'EXPIRED'){
      badge.textContent = 'Kode QR kedaluwarsa - hubungi toko lewat WhatsApp.';
      badge.style.color = 'hsl(var(--red))';
      stopPaymentPolling();
    } else if(result.statusBayar === 'FAILED'){
      badge.textContent = 'Pembayaran gagal - hubungi toko lewat WhatsApp.';
      badge.style.color = 'hsl(var(--red))';
      stopPaymentPolling();
    }
    // 'PENDING' - biarkan polling lanjut, badge tetap "Menunggu pembayaran..."
  }, 5000);
}
function stopPaymentPolling(){
  if(state.paymentPollInterval){ clearInterval(state.paymentPollInterval); state.paymentPollInterval=null; }
}

/**
 * Timer hitung mundur 24 jam di atas QR code, mulai dari `createdAtMs` pesanan (waktu
 * pesanan di-klik/dibuat - saved.CreatedAt server, BUKAN waktu struk dibuka, biar
 * konsisten walau struk ditutup lalu dibuka lagi berkali-kali). Update tiap detik,
 * berhenti otomatis begitu habis (tampilkan "Kode QR kedaluwarsa") atau struk ditutup
 * (closeReceipt di bawah) - pola sama `startPaymentPolling`/`stopPaymentPolling`.
 * @param {number} createdAtMs timestamp epoch ms (order.createdAtMs)
 */
function startQrisCountdown_(createdAtMs){
  stopQrisCountdown_();
  const DURASI_MS = 24 * 60 * 60 * 1000;
  const batasAkhir = (createdAtMs || Date.now()) + DURASI_MS;

  const tick = () => {
    const el = document.getElementById('qris-timer');
    if(!el){ stopQrisCountdown_(); return; } // struk sudah ditutup/beda pesanan
    const sisaMs = batasAkhir - Date.now();
    if(sisaMs <= 0){
      el.textContent = 'Kode QR kedaluwarsa';
      el.setAttribute('data-expired','true');
      stopQrisCountdown_();
      return;
    }
    const jam = Math.floor(sisaMs / 3600000);
    const menit = Math.floor((sisaMs % 3600000) / 60000);
    const detik = Math.floor((sisaMs % 60000) / 1000);
    const pad = n => String(n).padStart(2,'0');
    el.textContent = 'Bayar dalam ' + pad(jam) + ':' + pad(menit) + ':' + pad(detik);
  };
  tick();
  state.qrisCountdownInterval = setInterval(tick, 1000);
}
function stopQrisCountdown_(){
  if(state.qrisCountdownInterval){ clearInterval(state.qrisCountdownInterval); state.qrisCountdownInterval=null; }
}

function closeReceipt(){
  document.getElementById('receipt-overlay').setAttribute('data-open','false');
  state.receiptOrder=null;
  stopPaymentPolling();
  stopQrisCountdown_();
  stopTrackPolling_();
  document.body.style.overflow='';
}

function openProduct(id){
  const p = productById(id); if(!p) return;
  state.toppingPick = [];
  if(state.cartOpen) closeCart();
  const wasOpen = state.detailId!=null;
  state.detailId = p.id;
  renderDetailBody(p);
  renderDetailDynamic();
  document.getElementById('detail-overlay').setAttribute('data-open','true');
  document.getElementById('detail-scroll').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if(!wasOpen){ try{ history.pushState({dt:1}, ''); state.detailPushed = true; }catch(e){ state.detailPushed = false; } }
}
function closeProduct(fromPop){
  if(state.detailId==null) return;
  state.detailId = null;
  document.getElementById('detail-overlay').setAttribute('data-open','false');
  document.body.style.overflow = '';
  if(fromPop!==true && state.detailPushed){ try{ history.back(); }catch(e){} }
  state.detailPushed = false;
}
window.addEventListener('popstate', function(){ if(state.detailId!=null){ state.detailPushed = false; closeProduct(true); } }); // tombol/gesture Back HP menutup detail
async function shareProduct(){
  const p = productById(state.detailId); if(!p) return;
  const text = p.nama+' — '+homeRp(hargaAkhir(p))+' di '+STORE.nama, url = location.href.split(/[?#]/)[0];
  try{ if(navigator.share){ await navigator.share({title:p.nama, text:text, url:url}); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text+'\n'+url); showToast('Info produk disalin'); }
  catch(e){ showToast('Gagal membagikan produk'); }
}

// Chrome/Android nahan event ini biar kita bisa munculin tombol install
// custom sendiri (browser bawaannya nongol otomatis, tapi banner default
// kadang ketutup atau muncul di waktu yang aneh) - lihat renderInstallButton().
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallButton();
});
window.addEventListener('appinstalled', function(){
  deferredInstallPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.remove();
});
function renderInstallButton(){
  if(document.getElementById('pwa-install-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.textContent = '📲 Install Aplikasi';
  // bottom:152px sengaja di atas .bottom-nav (64px) + .mini-cart (bottom:80px, tinggi ~64px)
  // supaya gak ketiban dua-duanya.
  btn.style.cssText = 'position:fixed;left:16px;right:16px;max-width:460px;margin:0 auto;bottom:196px;z-index:40;'+
    'background:hsl(var(--red));color:#fff;border:none;border-radius:999px;'+
    'padding:12px 20px;font-family:inherit;font-weight:600;font-size:13.5px;'+
    'box-shadow:0 6px 20px rgba(0,0,0,.22);cursor:pointer';
  btn.onclick = async function(){
    if(!deferredInstallPrompt) return;
    btn.remove();
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  };
  document.body.appendChild(btn);
}
